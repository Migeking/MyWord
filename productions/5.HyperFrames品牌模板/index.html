<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>MYWORD · 品牌开场模板 (HyperFrames Tech Stack)</title>

  <!-- 字体：Noto Sans SC(中文) + Orbitron(数字/英文科技感) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ========================================================
       工业霓虹 (Industrial Neon) 设计系统
       所有变量集中在此，方便整站替换主题色
       ======================================================== */
    :root {
      --bg:        #080818;            /* 深空背景 */
      --bg-2:      #0c0c24;            /* 次级背景 */
      --accent-blue:   #4A7CFF;        /* 主蓝 */
      --accent-cyan:   #00E5FF;        /* 青色高亮 */
      --accent-coral:  #FF5E7A;        /* 珊瑚警示 */
      --accent-amber:  #FFB84D;        /* 琥珀强调 */
      --accent-green:  #00D4AA;        /* 成功绿 */
      --accent-purple: #8B7FFF;        /* 科技紫 */
      --text-primary:   #F0F0FF;       /* 主文字 */
      --text-secondary: #8888BB;       /* 次文字 */
      --text-dim:       rgba(240,240,255,0.5);
      --glass-bg:     rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px; height: 1920px;
      overflow: hidden;
      font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
      background: var(--bg);
    }

    #app {
      width: 1080px; height: 1920px;
      position: relative;
      overflow: hidden;
    }

    /* ===== 背景装饰层 (z:0) ===== */
    .bg-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .bg-gradient {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, #14142e 0%, #080818 65%, #04040e 100%);
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    }
    .bg-dot {
      position: absolute; border-radius: 50%;
      opacity: 0.15; filter: blur(60px);
    }
    .bg-dot.d1 { top:-120px; right:-100px; width:480px; height:480px; background:radial-gradient(circle,var(--accent-blue),transparent 70%); }
    .bg-dot.d2 { bottom:8%; left:-120px;     width:420px; height:420px; background:radial-gradient(circle,var(--accent-cyan),transparent 70%); }
    .bg-dot.d3 { bottom:38%; right:10%;     width:360px; height:360px; background:radial-gradient(circle,var(--accent-coral),transparent 70%); }
    .bg-ring  { position: absolute; border:1px solid rgba(255,255,255,0.05); border-radius:50%; }
    .bg-ring.r1 { width:600px; height:600px; top:8%;  left:-12%; }
    .bg-ring.r2 { width:420px; height:420px; bottom:18%; right:-8%; }

    /* ===== Three.js Canvas (z:1) ===== */
    #three-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* ===== Slide 层 (z:2) ===== */
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 120px 80px;
      opacity: 0;
      z-index: 2;
    }
    /* ★ 必加：HyperFrames 要求 .clip 的 slide 默认可见 */
    .slide.clip { opacity: 1; }

    /* ===== 通用 UI 元素 ===== */
    .slide-label {
      position: absolute; top:80px; left:80px;
      font-size:24px; letter-spacing:6px;
      font-weight:600;
      color: var(--accent-cyan);
      font-family: 'Orbitron', monospace;
    }
    .slide-tag {
      display: inline-block;
      padding: 10px 28px;
      font-size:26px; font-weight:700;
      letter-spacing:6px;
      border:1px solid var(--accent-cyan);
      border-radius: 24px;
      color: var(--accent-cyan);
      background: rgba(0,229,255,0.06);
      margin-bottom:36px;
    }
    .accent-line {
      width: 100px; height: 4px;
      border-radius: 2px;
      margin: 36px auto;
    }
    .accent-line.gradient {
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
      box-shadow: 0 0 20px rgba(0,229,255,0.6);
    }

    /* ===== Hero 标题 ===== */
    .hero { text-align: center; }
    .hero-title {
      font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
      font-size: 180px; font-weight: 900;
      line-height: 1; letter-spacing: 8px;
      margin-bottom: 30px;
    }
    .hero-title.small { font-size: 130px; }
    .hero-title .gradient-text {
      background: linear-gradient(135deg, #4A7CFF 0%, #00E5FF 50%, #8B7FFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(0,229,255,0.4));
    }
    .hero-sub {
      font-size: 48px; font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 4px;
      margin-top: 40px;
    }
    .hero-sub .highlight { color: var(--accent-cyan); }
    .hero-meta {
      margin-top: 50px;
      font-size: 28px; font-weight: 500;
      letter-spacing: 4px;
      color: var(--text-dim);
      padding: 12px 32px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 24px;
      background: rgba(0, 229, 255, 0.04);
      backdrop-filter: blur(8px);

    /* ===== 蝴蝶 SVG 图标（CSS 动画：翅膀扇动 + 悬浮） ===== */
    .butterfly-icon {
      width: 140px; height: 100px;
      margin: 0 auto 30px;

    .butterfly-icon svg {

    }
    @keyframes butterfly-flap {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(0.7); }
    }
    @keyframes butterfly-float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-12px) rotate(2deg); }
    }

    /* ===== 玻璃卡片 (Glass-morphism) ===== */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 36px;
      padding: 60px 60px;
      max-width: 920px;
      width: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .glass-card .card-accent {
      position: absolute; top:0; left:0;
      width: 6px; height: 100%;
      background: linear-gradient(180deg, var(--accent-blue), var(--accent-cyan), var(--accent-purple));
      box-shadow: 0 0 20px rgba(0,229,255,0.6);
    }
    .glass-card .card-title {

      color: var(--text-primary);

    }

      -webkit-background-clip: text;

    .glass-card .card-text {
      font-size: 36px; font-weight: 400;

    }

    /* ===== 数据卡片 (Stats) ===== */
    .card-stats {

    .stat {

      border: 1px solid rgba(255,255,255,0.06);

    .stat-num {

    .stat-num.blue   { color: var(--accent-blue); }
    .stat-num.cyan   { color: var(--accent-cyan); }
    .stat-num.purple { color: var(--accent-purple); }
    .stat-num .unit  { font-size: 28px; font-weight: 600; margin-left: 4px; }
    .stat-label {
      font-size: 22px;
      color: var(--text-secondary);
      letter-spacing: 2px;
    }

    /* ===== CTA 按钮 ===== */
    .cta {
      display: inline-flex; align-items: center; gap: 16px;
      padding: 28px 60px;
      font-size: 36px; font-weight: 700;

    .cta::after { content: '→'; font-size: 44px; line-height: 1; }

    .progress-text {
      position: absolute; top:104px; right:80px;

      text-align: center;
      font-family: 'Orbitron', monospace;
      font-size: 22px; letter-spacing: 8px;
      color: var(--text-dim);
    }
  </style>

  <script type="module">
    /* ============================================================
       🦋 蝴蝶粒子系统 —— 完全按鲸鱼粒子的架构重写
       80,000 主粒子 + 30,000 拖尾 + 8,000 星空 = 118,000 粒子
       架构：多边形轮廓 → 拒绝采样 → partType 分类 → HDR 蓝金配色
       ============================================================ */
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";

    /* ==== Renderer / Scene / Camera（与鲸鱼一致）==== */
    const canvas = document.getElementById("three-layer");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(1080, 1920, false);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x010409, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 200);

    /* ==== 确定性 PRNG（与鲸鱼一致：Lehmer 16807）==== */
    let seed = 998244353;
    function random() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    /* ============================================================
       翅膀多边形轮廓（局部坐标：X 横向，Y 纵向，Z 深度）
       — 上翅膀较大，扇形展开（16 点）
       — 下翅膀较小，尾部下垂（13 点）
       — 身体为细长椭圆（8 点）
       ============================================================ */
    const upperWingPoly = [
      [ 0.0,  0.1],  [-0.3,  0.4],  [-0.5,  0.8],  [-0.7,  1.2],
      [-1.0,  1.5],  [-1.3,  1.7],  [-1.6,  1.85], [-1.9,  1.95],
      [-2.2,  1.9],  [-2.4,  1.7],  [-2.5,  1.4],  [-2.4,  1.0],
      [-2.2,  0.6],  [-1.8,  0.3],  [-1.3,  0.15], [-0.7,  0.05]
    ];
    const lowerWingPoly = [
      [ 0.0,  0.0],  [-0.2, -0.2],  [-0.3, -0.4],  [-0.4, -0.6],
      [-0.6, -0.8],  [-0.8, -1.0],  [-1.0, -1.2],  [-1.2, -1.4],
      [-1.3, -1.5],  [-1.3, -1.2],  [-1.0, -0.9],  [-0.7, -0.6],
      [-0.4, -0.3]
    ];
    const bodyPoly = [
      [ 0.0,  1.4],  [ 0.08,  0.7],  [ 0.10,  0.0],
      [ 0.08, -0.7],  [ 0.0,  -1.3],  [-0.08, -0.7],
      [-0.10,  0.0],  [-0.08,  0.7]
    ];

    /* ==== 几何工具（与鲸鱼完全相同）==== */
    function pointInPolygon(x, y, vs) {
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const xi = vs[i][0], yi = vs[i][1];
        const xj = vs[j][0], yj = vs[j][1];
        if (((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
          inside = !inside;
        }
      }
      return inside;
    }
    function distanceToPolygon(x, y, poly) {
      let minDist = Infinity;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const x1 = poly[j][0], y1 = poly[j][1];
        const x2 = poly[i][0], y2 = poly[i][1];
        const A = x - x1, B = y - y1;
        const C = x2 - x1, D = y2 - y1;
        const dot = A * C + B * D;
        const lenSq = C * C + D * D;
        let param = -1;
        if (lenSq != 0) param = dot / lenSq;
        let xx, yy;
        if (param < 0)        { xx = x1; yy = y1; }
        else if (param > 1)   { xx = x2; yy = y2; }
        else                  { xx = x1 + param * C; yy = y1 + param * D; }
        const dx = x - xx, dy = y - yy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    /* ============================================================
       1. 主蝴蝶粒子 —— 完全按鲸鱼的"拒绝采样 + partType 分类"模式
       ============================================================ */
    const particles = 80000;
    const positions  = new Float32Array(particles * 3);
    const colors     = new Float32Array(particles * 3);
    const randoms    = new Float32Array(particles);
    const aPartType  = new Float32Array(particles);

    for (let i = 0; i < particles; i++) {
      let found = false;
      let wx = 0, wy = 0, wz = 0;
      let partType = 0; // 0=body, 1=L-up, 2=R-up, 3=L-down, 4=R-down, 5=antenna

      while (!found) {
        wx = (random() - 0.5) * 8.0;   // X 范围
        wy = (random() - 0.5) * 6.0;   // Y 范围
        wz = (random() - 0.5) * 1.5;   // Z 厚度（翅膀很薄）

        const mirrorX = Math.abs(wx);  // 镜像采样，自动得到左右翅膀

        // 1) 身体（中心区域）：保留全部 Z 厚度（身体是立体的）
        if (pointInPolygon(wx, wy, bodyPoly)) {
          partType = 0;
          found = true;
        }

        // 2) 上翅膀（左/右）：3D 厚度扩展 + 三层决策（edge/flowline/interior）
        if (!found && pointInPolygon(-mirrorX, wy, upperWingPoly)) {
          const distEdge = distanceToPolygon(-mirrorX, wy, upperWingPoly);
          partType = wx < 0 ? 1 : 2;  // 左/右

          /* === P0 关键：3D sqrt 厚度扩展（鲸鱼同款）===
             翅膀剖面是"双凸透镜"——中脉厚，前后缘薄 */
          let maxThickness = 0.5;
          if (wy > 0.8)      maxThickness = 0.35;   // 翅尖最薄
          else if (wy < -0.5) maxThickness = 0.30;  // 边缘薄
          let normalizedDepth = Math.min(1.0, distEdge / 0.4);
          let actualThickness = maxThickness * Math.sqrt(normalizedDepth);
          if (Math.abs(wz) > actualThickness) continue;  // 厚度不命中，继续投

          // 与鲸鱼同款：边缘保留 + 内部流线稀疏填充
          const isEdge     = (distEdge < 0.10);
          const flow1      = Math.sin(wy * 4.0 + mirrorX * 1.0);
          const flow2      = Math.cos(mirrorX * 2.0 - wy * 0.5);
          const isFlowLine = (flow1 > 0.5 || flow2 > 0.7);

          if (isEdge || (isFlowLine && random() < 0.5)) {
            found = true;
          }
        }

        // 3) 下翅膀（左/右）：同样应用 3D 厚度 + 三层决策
        if (!found && pointInPolygon(-mirrorX, wy, lowerWingPoly)) {
          const distEdge = distanceToPolygon(-mirrorX, wy, lowerWingPoly);
          partType = wx < 0 ? 3 : 4;

          let maxThickness = 0.4;
          let normalizedDepth = Math.min(1.0, distEdge / 0.3);
          let actualThickness = maxThickness * Math.sqrt(normalizedDepth);
          if (Math.abs(wz) > actualThickness) continue;

          /* === P1 关键：下翼也加 isFlowLine 流线层 === */
          const isEdge     = (distEdge < 0.10);
          const flow1      = Math.sin(wy * 3.0 + mirrorX * 1.5);
          const flow2      = Math.cos(mirrorX * 2.5 - wy * 0.8);
          const isFlowLine = (flow1 > 0.5 || flow2 > 0.7);

          if (isEdge || (isFlowLine && random() < 0.45) || random() < 0.25) {
            found = true;
          }
        }
      }

      /* ==== 颜色分配（参考图：蓝金渐变）==== */
      let r = 0, g = 0, b = 0;
      // 找到对应的轮廓用于距离计算
      const refPoly =
        partType === 0 ? bodyPoly :
        (partType === 1 || partType === 2) ? upperWingPoly : lowerWingPoly;
      const refX = partType === 0 ? wx : -Math.abs(wx);
      const dist = distanceToPolygon(refX, wy, refPoly);

      if (partType === 0) {
        /* 身体：电光蓝 + 头部高光 */
        r = 0.3 + random() * 0.2;
        g = 0.6 + random() * 0.2;
        b = 1.0;
        if (wy > 1.0 && wy < 1.4 && random() < 0.5) {
          r = 1.0; g = 0.9; b = 0.7;  // 头部高光
        }
      } else {
        /* 翅膀 */
        if (dist < 0.10) {
          /* 边缘菲涅尔：金色 */
          r = 1.0; g = 0.7; b = 0.3;
        } else if (dist < 0.25 && random() < 0.5) {
          /* 亚边缘：金色加重 */
          r = 0.9; g = 0.6; b = 0.2;
        } else {
          /* 内部：蓝色渐变 */
          const heightRatio = (wy + 1.5) / 3.0;
          r = 0.1;
          g = 0.4 + heightRatio * 0.4;
          b = 0.7 + (1 - Math.abs(heightRatio - 0.5)) * 0.3;
        }
      }

      /* 3% 星尘粒子（全白） */
      if (random() < 0.03) { r = 1.0; g = 1.0; b = 1.0; }

      positions[i*3]   = wx;
      positions[i*3+1] = wy;
      positions[i*3+2] = wz;
      colors[i*3]   = r;
      colors[i*3+1] = g;
      colors[i*3+2] = b;
      randoms[i]    = random();
      aPartType[i]  = partType;
    }

    /* ==== 触角（在主循环之后追加 2×30=60 颗）==== */
    for (let a = 0; a < 2; a++) {
      const sideX = a === 0 ? -0.04 : 0.04;
      for (let i = 0; i < 30; i++) {
        const t = i / 29;
        const y = 1.35 + t * 0.9;
        const x = sideX + Math.sin(t * 2.5 + a) * 0.12;
        const idx = 80000 - 60 + a * 30 + i;
        positions[idx*3]   = x;
        positions[idx*3+1] = y;
        positions[idx*3+2] = (a === 0 ? -0.02 : 0.02);
        colors[idx*3]   = 0.4;
        colors[idx*3+1] = 0.6;
        colors[idx*3+2] = 1.0;
        randoms[idx]    = random();
        aPartType[idx]  = 5;  // antenna
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position',  new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color',     new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('randomVal',  new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute('aPartType', new THREE.BufferAttribute(aPartType, 1));

    const whaleUniforms = { uTime: { value: 0 } };

    const whaleMaterial = new THREE.ShaderMaterial({
      uniforms: whaleUniforms,
      vertexShader: `
        uniform float uTime;
        attribute float randomVal;
        attribute vec3  color;
        attribute float aPartType;
        varying vec3  vColor;
        varying float vAlpha;

        void main() {
          /* === 1. HDR twinkle（鲸鱼同款）=== */
          float twinkle = sin(uTime * 4.0 + randomVal * 50.0) * 0.5 + 0.5;
          vColor = color * (0.6 + twinkle * 0.8);

          vec3 pos = position;

          /* === 2. 翅膀扇动（仅翅膀粒子 1-4，body+antenna 不动）=== */
          if (aPartType > 0.5 && aPartType < 4.5) {
            float flap = sin(uTime * 7.0) * 0.5 + 0.5;       // 0~1, 周期 ~0.9s
            float scaleY = 0.85 + flap * 0.30;                // 0.85~1.15
            float scaleX = 0.95 + flap * 0.10;                // 0.95~1.05
            pos.y *= scaleY;
            pos.x *= scaleX;
            /* Z 方向起伏 → 翅膀拍动的厚度感 */
            pos.z += sin(uTime * 7.0) * 0.15;
          }

          /* === 3. Magical shedding（1.5% 粒子飘散） === */
          if (randomVal < 0.015) {
            float driftTime = fract(uTime * 0.15 + randomVal);
            pos.y += driftTime * 0.8;                            // 向上飘
            pos.x -= driftTime * 0.5;                            // 向后飘
            pos.z += sin(driftTime * 8.0 + randomVal * 100.0) * 0.3;
          }

          /* === 4. 微闪烁 === */
          pos.x += sin(uTime * 4.0 + randomVal * 10.0) * 0.02;
          pos.y += cos(uTime * 3.0 + randomVal * 20.0) * 0.02;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          /* === 5. 粒子尺寸（鲸鱼同款公式）=== */
          float baseSize = (10.0 * randomVal + 3.0);
          if (randomVal < 0.015) {
            baseSize *= (1.0 - fract(uTime * 0.15 + randomVal));  // 飘散时缩小
          }
          if (aPartType > 0.5 && aPartType < 4.5) baseSize *= 0.9;  // 翅膀稍小
          gl_PointSize = baseSize / -mvPosition.z * 30.0;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if (d > 0.5) discard;
          /* HDR 中心高亮（鲸鱼同款） */
          float alpha = smoothstep(0.5, 0.1, d) * 0.35;
          float core  = smoothstep(0.2, 0.0, d) * 0.8;
          gl_FragColor = vec4(vColor + vec3(core), alpha + core);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const butterflySystem = new THREE.Points(geometry, whaleMaterial);
    /* 缩放：让蝴蝶在屏幕中更醒目 */
    butterflySystem.scale.set(1.4, 1.4, 1.4);
    scene.add(butterflySystem);

    /* ============================================================
       2. 蝴蝶拖尾粒子 —— 完全按鲸鱼模式：三次贝塞尔 + t-offset 延迟
       ============================================================ */
    const trailParticles = 30000;
    const tOffsets = new Float32Array(trailParticles);
    const tRandoms = new Float32Array(trailParticles);
    const tColors  = new Float32Array(trailParticles * 3);

    for (let i = 0; i < trailParticles; i++) {
      tOffsets[i] = random() * 5.0;  // 延迟 0~5s
      tRandoms[i] = random();
      /* 蓝金混合 */
      if (random() < 0.5) {
        tColors[i*3]   = 0.1;  tColors[i*3+1] = 0.6;  tColors[i*3+2] = 1.0;
      } else {
        tColors[i*3]   = 1.0;  tColors[i*3+1] = 0.7;  tColors[i*3+2] = 0.3;
      }
    }

    const tGeo = new THREE.BufferGeometry();
    tGeo.setAttribute('position',    new THREE.BufferAttribute(new Float32Array(trailParticles * 3), 3));
    tGeo.setAttribute('trailOffset', new THREE.BufferAttribute(tOffsets, 1));
    tGeo.setAttribute('randomVal',   new THREE.BufferAttribute(tRandoms, 1));
    tGeo.setAttribute('color',       new THREE.BufferAttribute(tColors, 3));

    const trailUniforms = { uTime: { value: 0 } };

    const trailMaterial = new THREE.ShaderMaterial({
      uniforms: trailUniforms,
      vertexShader: `
        uniform float uTime;
        attribute float trailOffset;
        attribute float randomVal;
        attribute vec3  color;
        varying float vAlpha;
        varying vec3  vColor;

        void main() {
          float t = uTime - trailOffset;
          if (t < 0.0) {
            gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
            vAlpha = 0.0;
            return;
          }

          /* === 拖尾沿与主蝴蝶完全相同的三次贝塞尔路径 === */
          float normT = clamp(t / 30.0, 0.0, 1.0);

          vec3 p0 = vec3(-10.0, -8.0,  0.0);
          vec3 p1 = vec3( 12.0,  5.0, -3.0);
          vec3 p2 = vec3(-12.0,  5.0,  3.0);
          vec3 p3 = vec3( 10.0, -8.0,  0.0);

          float omt  = 1.0 - normT;
          float b0   = omt * omt * omt;
          float b1   = 3.0 * omt * omt * normT;
          float b2   = 3.0 * omt * normT * normT;
          float b3   = normT * normT * normT;
          vec3 pathPos = b0 * p0 + b1 * p1 + b2 * p2 + b3 * p3;

          /* === P1-1 关键：拖尾复现翅膀拍动节奏（鲸鱼 tail-wag 同款）===
             拖尾粒子跟随主蝴蝶的"翅膀扇动"相位，让尾迹也有节奏感 */
          float flapPhase = t * 7.0;
          float flapY = sin(flapPhase) * 0.5;  // ±0.5 单位的上下脉冲
          pathPos.y += flapY * smoothstep(0.0, 2.0, t);  // 新粒子振幅小，老粒子大

          /* === 翼尖发散（拖尾从翅膀区域散开）=== */
          pathPos.x += sin(t * 4.0 + randomVal * 8.0) * 1.2;
          pathPos.y += cos(t * 3.0 + randomVal * 6.0) * 0.8;
          pathPos.z += sin(t * 2.0 + randomVal * 4.0) * 0.6;

          vec4 mvPosition = viewMatrix * vec4(pathPos, 1.0);
          gl_PointSize = (12.0 * randomVal + 2.0) / -mvPosition.z;
          gl_Position = projectionMatrix * mvPosition;

          vAlpha = smoothstep(5.0, 0.0, trailOffset) * 0.5;
          vColor = color;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        varying vec3  vColor;
        void main() {
          if (vAlpha <= 0.0) discard;
          float d = distance(gl_PointCoord, vec2(0.5));
          if (d > 0.5) discard;
          float alpha = smoothstep(0.5, 0.1, d) * vAlpha;
          gl_FragColor = vec4(vColor, alpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const trailSystem = new THREE.Points(tGeo, trailMaterial);
    scene.add(trailSystem);

    /* ============================================================
       3. 背景星空粒子（与鲸鱼同款）
       ============================================================ */
    const starParticles = 8000;
    const sPositions = new Float32Array(starParticles * 3);
    const sColors    = new Float32Array(starParticles * 3);
    const sRandoms   = new Float32Array(starParticles);

    for (let i = 0; i < starParticles; i++) {
      sPositions[i*3]   = (random() - 0.5) * 80;
      sPositions[i*3+1] = (random() - 0.5) * 100;
      sPositions[i*3+2] = (random() - 0.5) * 30;

      const cType = random();
      if      (cType < 0.6) { sColors[i*3] = 0.0; sColors[i*3+1] = 0.6; sColors[i*3+2] = 1.0; }  // 青
      else if (cType < 0.9) { sColors[i*3] = 1.0; sColors[i*3+1] = 1.0; sColors[i*3+2] = 1.0; }  // 白
      else                  { sColors[i*3] = 0.7; sColors[i*3+1] = 0.0; sColors[i*3+2] = 1.0; }  // 紫

      sRandoms[i] = random();
    }

    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(sPositions, 3));
    starGeo.setAttribute('color',    new THREE.BufferAttribute(sColors, 3));
    starGeo.setAttribute('randoms',  new THREE.BufferAttribute(sRandoms, 1));

    const starMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        uniform float uTime;
        attribute vec3  color;
        attribute float randoms;
        varying vec3  vColor;
        varying float vAlpha;
        void main() {
          vColor = color;
          vec3 pos = position;
          pos.x += sin(uTime * 0.15 + randoms * 10.0) * 2.0;
          pos.y += cos(uTime * 0.12 + randoms * 10.0) * 2.0;
          vAlpha = 0.3 + sin(uTime * 1.5 + randoms * 20.0) * 0.4;
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          gl_PointSize = (randoms * 3.0 + 1.0) / -mvPosition.z;
        }
      `,
      fragmentShader: `
        varying vec3  vColor;
        varying float vAlpha;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if (d > 0.5) discard;
          gl_FragColor = vec4(vColor, vAlpha * smoothstep(0.5, 0.1, d));
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const starSystem = new THREE.Points(starGeo, starMat);
    scene.add(starSystem);

    /* ============================================================
       3.5 godRays（丁达尔光柱）—— 鲸鱼同款：angle-noise + 锥形 mask
       锁定相机 → 永远在蝴蝶背后 50 单位
       ============================================================ */
    const godRaysGeo = new THREE.PlaneGeometry(150, 100);
    const godRaysMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;

        float hash(float n) { return fract(sin(n) * 1e4); }
        float noise(float x) {
          float i = floor(x); float f = fract(x);
          float u = f * f * (3.0 - 2.0 * f);
          return mix(hash(i), hash(i + 1.0), u);
        }

        void main() {
          /* 极坐标角度 → 放射状射线 */
          vec2 pos = vUv - vec2(0.5, 1.0);
          float angle = atan(pos.y, pos.x);

          float t = uTime * 0.15;
          float ray1 = noise(angle * 30.0 + t) * noise(angle * 10.0 - t * 0.8);
          float ray2 = noise(angle * 50.0 - t * 1.5) * noise(angle * 15.0 + t);
          float intensity = (ray1 * 0.6 + ray2 * 0.4);
          intensity = pow(intensity, 2.0) * 5.0;

          /* 锥形光束：顶部窄、底部宽 */
          float beamWidth = 0.15 + abs(pos.y) * 0.25;
          float beamMask  = smoothstep(beamWidth, beamWidth * 0.2, abs(pos.x));

          float fadeY       = smoothstep(0.0, 0.9, vUv.y);
          float radialFade  = smoothstep(1.0, 0.05, length(pos));
          intensity *= fadeY * radialFade * beamMask;

          /* 顶部"日轮"高亮 */
          float sunGlow = smoothstep(0.15, 0.0, length(pos)) * 2.0;
          intensity += sunGlow * fadeY;

          /* 暖金丁达尔色（呼应参考图） */
          vec3 goldRim  = vec3(0.9, 0.7, 0.3);
          vec3 goldCore = vec3(1.0, 0.95, 0.7);
          vec3 rayColor = mix(goldRim, goldCore, clamp(intensity * 0.5, 0.0, 1.0));

          gl_FragColor = vec4(rayColor, intensity * 0.6);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const godRays = new THREE.Mesh(godRaysGeo, godRaysMat);
    scene.add(godRays);

    /* ============================================================
       3.6 caustics（焦散光斑）—— 鲸鱼同款：Voronoi 噪声 + 滚动波
       作为"天花板"：旋转 -90° 放在 y=14
       ============================================================ */
    const causticsGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
    const causticsMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vec3 pos = position;
          float wave1 = sin(pos.x * 0.1 + uTime * 0.8) * 1.5;
          float wave2 = cos(pos.y * 0.15 - uTime * 0.5) * 1.0;
          pos.z += wave1 + wave2;
          vPos = pos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vPos;

        vec2 hash2(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return fract(sin(p) * 43758.5453);
        }
        float voronoi(vec2 x) {
          vec2 n = floor(x);
          vec2 f = fract(x);
          float m = 1.0;
          for (int j = -1; j <= 1; j++)
          for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = hash2(n + g);
            o = 0.5 + 0.5 * sin(uTime * 1.5 + 6.2831 * o);
            vec2 r = g + o - f;
            float d = dot(r, r);
            if (d < m) m = d;
          }
          return m;
        }

        void main() {
          vec2 p = vUv * 40.0;
          p.x += sin(vUv.y * 10.0 + uTime) * 0.5;
          p.y += cos(vUv.x * 10.0 - uTime) * 0.5;

          float c1 = voronoi(p);
          float c2 = voronoi(p * 1.5 + uTime * 0.3);
          float caustics = pow(1.0 - c1, 3.0) + pow(1.0 - c2, 4.0) * 0.5;

          float waveGlow = smoothstep(-1.0, 2.5, vPos.z) * 0.5;
          float intensity = caustics * 1.5 + waveGlow;

          float fade = smoothstep(0.5, 0.0, distance(vUv, vec2(0.5)));
          intensity *= fade;

          vec3 waterColor = mix(vec3(0.0, 0.6, 1.0), vec3(1.0, 0.95, 0.7), clamp(intensity, 0.0, 1.0));
          gl_FragColor = vec4(waterColor, intensity * 0.6);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const caustics = new THREE.Mesh(causticsGeo, causticsMat);
    caustics.rotation.x = -Math.PI / 2;
    caustics.position.set(0, 14, 0);
    scene.add(caustics);

    /* ============================================================
       4. 渲染循环 —— 沿用鲸鱼的三次贝塞尔 + 相机跟随
       ============================================================ */
    function renderAt(time) {
      whaleUniforms.uTime.value  = time;
      trailUniforms.uTime.value  = time;
      starMat.uniforms.uTime.value = time;
      godRaysMat.uniforms.uTime.value = time;
      causticsMat.uniforms.uTime.value = time;

      let normT = time / 30.0;     // 与鲸鱼一致：30s 周期
      if (normT > 1.0) normT = 1.0;
      if (normT < 0.0) normT = 0.0;

      /* 三次贝塞尔飞行路径（与拖尾使用完全相同的控制点） */
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(-10, -8,  0),
        new THREE.Vector3( 12,  5, -3),
        new THREE.Vector3(-12,  5,  3),
        new THREE.Vector3( 10, -8,  0)
      );

      const pos     = curve.getPoint(normT);
      const tangent = curve.getTangent(normT).normalize();

      butterflySystem.position.copy(pos);

      const targetUp = new THREE.Vector3(0, 1, 0);
      const right    = new THREE.Vector3().crossVectors(targetUp, tangent).normalize();
      const newUp    = new THREE.Vector3().crossVectors(tangent, right).normalize();

      /* 飞行转向时的自然倾斜（banking） */
      const t2          = Math.min(1.0, normT + 0.05);
      const nextTangent = curve.getTangent(t2).normalize();
      const turnAxis    = new THREE.Vector3().crossVectors(tangent, nextTangent);
      const bankAngle   = turnAxis.y * -15.0;
      const bankRot     = new THREE.Matrix4().makeRotationAxis(tangent, bankAngle);
      newUp.applyMatrix4(bankRot);
      right.applyMatrix4(bankRot);

      const m = new THREE.Matrix4();
      m.makeBasis(tangent, newUp, right.negate());
      butterflySystem.quaternion.setFromRotationMatrix(m);

      /* 相机微动跟踪（鲸鱼同款） */
      camera.position.set(0, 0, 24);
      camera.position.x = Math.sin(normT * Math.PI) * 2.0;
      camera.lookAt(pos.x * 0.3, pos.y * 0.3, pos.z * 0.3);

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });

    renderAt(window.__hfThreeTime || 0);
    console.log(`[蝴蝶系统] 80,000 主粒子 + 30,000 拖尾 + 8,000 星空 + 2 环境层 = 120,000 粒子`);

    /* ============================================================
       GSAP 时间线：4 个 slide 各 3s
       ============================================================ */
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const slides = document.querySelectorAll('#app .slide');
    slides.forEach((slide, idx) => {
      const start = parseFloat(slide.dataset.start);
      const dur   = parseFloat(slide.dataset.duration);
      const end   = start + dur;
      const isLast = idx === slides.length - 1;

      /* slide 整体淡入 + 上移 */
      tl.fromTo(slide,
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        start
      );
      if (!isLast) {
        tl.to(slide,
          { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" },
          end - 0.25
        );
      }

      /* hero 标题缩放 + 模糊解除 */
      const heroTitle = slide.querySelector('.hero-title');
      if (heroTitle) {
        tl.fromTo(heroTitle,
          { scale: 0.7, filter: "blur(20px)" },
          { scale: 1,   filter: "blur(0px)", duration: 0.6, ease: "back.out(1.4)" },
          start + 0.1
        );
        if (!isLast) {
          tl.to(heroTitle,
            { scale: 0.9, filter: "blur(8px)", duration: 0.3 },
            end - 0.35
          );
        }
      }

      /* 蝴蝶图标 + meta */
      const bflyIcon = slide.querySelector('.butterfly-icon');
      if (bflyIcon) {
        tl.fromTo(bflyIcon,
          { scale: 0, opacity: 0, rotation: -45 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)" },
          start + 0.05
        );
      }
      const heroMeta = slide.querySelector('.hero-meta');
      if (heroMeta) {
        tl.fromTo(heroMeta,
          { y: 20, opacity: 0 },
          { y: 0,  opacity: 1, duration: 0.5, ease: "power2.out" },
          start + 0.5
        );
      }

      /* 玻璃卡片入场 */
      const card = slide.querySelector('.glass-card');
      if (card) {
        tl.fromTo(card,
          { y: 80, opacity: 0, scale: 0.92 },
          { y: 0,  opacity: 1, scale: 1,    duration: 0.6, ease: "power3.out" },
          start + 0.15
        );
        const tag   = card.querySelector('.slide-tag');
        const title = card.querySelector('.card-title');
        const text  = card.querySelector('.card-text');
        const stats = card.querySelectorAll('.stat');
        if (tag)   tl.fromTo(tag,   { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3 }, start + 0.30);
        if (title) tl.fromTo(title, { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3 }, start + 0.40);
        if (text)  tl.fromTo(text,  { y:  20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, start + 0.50);
        stats.forEach((s, i) => {
          tl.fromTo(s,
            { y: 30, opacity: 0 },
            { y: 0,  opacity: 1, duration: 0.4, ease: "back.out(1.5)" },
            start + 0.6 + i * 0.1
          );
        });
      }

      /* CTA 按钮：弹入 + 脉冲 */
      const cta = slide.querySelector('.cta');
      if (cta) {
        tl.fromTo(cta,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
          start + 0.3
        );
        if (dur > 1.5) {
          tl.to(cta,
            { scale: 1.05, duration: 0.4, ease: "power2.inOut", yoyo: true, repeat: Math.max(1, Math.floor((dur - 1) / 0.8)) },
            start + 1
          );
        }
      }

      /* 进度条 */
      const fill = slide.querySelector('.progress-fill');
      if (fill) {
        tl.fromTo(fill,
          { width: "0%" },
          { width: "100%", duration: dur, ease: "none" },
          start
        );
      }
    });

    /* ★ 注册到 HyperFrames */
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
