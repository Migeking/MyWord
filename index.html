<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWord · content-hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --soft: #eef1f5;
    --line: #e2e6ed;
    --line-soft: #eef1f5;
    --ink: #1a1f2e;
    --ink-soft: #4a5266;
    --ink-faint: #8a92a6;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --info: #3b82f6;
    --accent: #4f46e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 24px 32px 60px;
    min-height: 100vh;
  }

  /* ===== Top bar ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: white;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.4);
  }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .ver {
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .topbar-right .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ok);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .topbar-right .live::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 var(--ok);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .topbar-right .ts { color: var(--ink-faint); font-size: 12px; }

  /* ===== KPI grid ===== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .kpi .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .kpi .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .kpi .num .unit { font-size: 14px; color: var(--ink-faint); font-weight: 500; }
  .kpi .delta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ok);
    font-weight: 500;
  }
  .kpi .delta.down { color: var(--err); }
  .kpi .delta.neutral { color: var(--ink-faint); }
  .kpi .spark {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 72px;
    height: 24px;
    opacity: 0.85;
  }

  /* ===== Toolbar ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 16px;
  }
  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .search .icon { color: var(--ink-faint); font-size: 14px; }
  .search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search .kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .toolbar .divider { width: 1px; height: 20px; background: var(--line); }
  .toolbar .filter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
  }
  .toolbar .filter:hover { background: var(--soft); }
  .toolbar .filter.active {
    background: var(--accent);
    color: white;
  }
  .toolbar .view {
    display: inline-flex;
    background: var(--soft);
    border-radius: 6px;
    padding: 2px;
  }
  .toolbar .view button {
    background: transparent;
    border: none;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--ink-soft);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar .view button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  /* ===== Group card ===== */
  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }
  .group-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .group-head .name { font-weight: 600; font-size: 13px; }
  .group-head .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--card);
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .group-head .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* ===== Row ===== */
  .row {
    display: grid;
    grid-template-columns: 16px 1fr 70px 100px 90px auto;
    gap: 16px;
    padding: 10px 16px;
    align-items: center;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
    transition: background 0.1s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(79, 70, 229, 0.04); }
  .row .indicator { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
  .row .indicator.ok { background: var(--ok); }
  .row .indicator.warn { background: var(--warn); }
  .row .indicator.err { background: var(--err); }
  .row .asset { min-width: 0; }
  .row .asset .title {
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .asset .path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .size {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }
  .row .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .row .bar {
    height: 4px;
    background: var(--soft);
    border-radius: 2px;
    overflow: hidden;
  }
  .row .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }
  .row .tags {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .row .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--soft);
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 2px 6px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    user-select: none;
  }
  .row .tag:hover { background: var(--accent); color: white; }
  .row .tag.active { background: var(--accent); color: white; }

  /* ===== Empty / Fatal ===== */
  .empty, .fatal {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty h2, .fatal h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }
  .empty code, .fatal code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--soft);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
  }
  .empty .hint, .fatal .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .reset-btn {
    cursor: pointer;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 6px 16px;
    margin-top: 16px;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.1s;
  }
  .reset-btn:hover { background: var(--accent); color: white; }

  /* ===== Loading ===== */
  .loading {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--ink-faint);
  }

  /* ===== Hidden ===== */
  .row.hidden { display: none; }
  .group.hidden { display: none; }

  /* ===== Responsive ===== */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 800px) {
    body { padding: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr; gap: 6px; padding: 12px 16px; }
    .row .indicator { display: none; }
    .row .size, .row .date, .row .bar, .row .tags { justify-self: start; text-align: left; }
  }
  @media (max-width: 500px) {
    .kpi-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <!-- ===== Top bar ===== -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <h1>MyWord<span class="ver">v1.0.0</span></h1>
    </div>
    <div class="topbar-right">
      <span class="live">Live</span>
      <span>·</span>
      <span class="ts" id="last-refresh">—</span>
    </div>
  </div>

  <!-- ===== KPI grid ===== -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="label">Total Assets</div>
      <div class="num" id="kpi-items">—</div>
      <div class="delta neutral" id="kpi-items-delta">—</div>
      <svg class="spark" viewBox="0 0 72 24" preserveAspectRatio="none" id="kpi-items-spark"></svg>
    </div>
    <div class="kpi">
      <div class="label">Groups</div>
      <div class="num" id="kpi-groups">—</div>
      <div class="delta neutral" id="kpi-groups-delta">—</div>
      <svg class="spark" viewBox="0 0 72 24" preserveAspectRatio="none" id="kpi-groups-spark"></svg>
    </div>
    <div class="kpi">
      <div class="label">Files</div>
      <div class="num" id="kpi-files">—</div>
      <div class="delta neutral" id="kpi-files-delta">—</div>
      <svg class="spark" viewBox="0 0 72 24" preserveAspectRatio="none" id="kpi-files-spark"></svg>
    </div>
    <div class="kpi">
      <div class="label">Tags</div>
      <div class="num" id="kpi-tags">—</div>
      <div class="delta neutral">distinct</div>
      <svg class="spark" viewBox="0 0 72 24" preserveAspectRatio="none" id="kpi-tags-spark"></svg>
    </div>
    <div class="kpi">
      <div class="label">Last Refresh</div>
      <div class="num" id="kpi-last" style="font-size:22px;line-height:1.4;padding-top:4px;">—</div>
      <div class="delta neutral">auto-scan 5m</div>
    </div>
  </div>

  <!-- ===== Toolbar ===== -->
  <div class="toolbar">
    <div class="search">
      <span class="icon">⌕</span>
      <input type="text" id="search" placeholder="Search assets by name, description, or tag...">
      <span class="kbd">/</span>
    </div>
    <span class="divider"></span>
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="updated">Updated 7d</button>
    <button class="filter" data-filter="tagged">Has tags</button>
    <span class="divider"></span>
    <div class="view">
      <button class="active" data-view="table">Table</button>
      <button data-view="grid">Grid</button>
    </div>
  </div>

  <!-- ===== Groups ===== -->
  <main id="groups" aria-live="polite">
    <div class="loading">Loading data.json…</div>
  </main>

  <script>
    (async function main() {
      const groupsEl = document.getElementById('groups');

      try {
        const res = await fetch('./data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const DATA = await res.json();
        renderAll(DATA);
        setupFilter();
        setupKeyboard();
      } catch (err) {
        groupsEl.innerHTML = `
          <div class="fatal">
            <h2>Failed to load <code>data.json</code></h2>
            <p class="hint">${escapeHtml(err.message)}</p>
            <p class="hint">Run in project root: <code>node scripts/scan-index.js</code></p>
          </div>`;
      }
    })();

    function renderAll(DATA) {
      renderKpis(DATA);
      renderTopbar(DATA);
      renderGroups(DATA.groups);
    }

    function renderTopbar(DATA) {
      const el = document.getElementById('last-refresh');
      el.textContent = 'Last refresh ' + timeAgo(DATA.generatedAt);
    }

    function renderKpis(DATA) {
      document.getElementById('kpi-items').innerHTML = DATA.totals.items;
      document.getElementById('kpi-groups').innerHTML = DATA.totals.groups;
      document.getElementById('kpi-files').innerHTML = DATA.totals.files;
      const distinctTags = new Set();
      DATA.groups.forEach(g => g.items.forEach(it => (it.tags || []).forEach(t => distinctTags.add(t))));
      document.getElementById('kpi-tags').innerHTML = distinctTags.size;

      // 静态 delta（演示用）
      document.getElementById('kpi-items-delta').textContent = '↑ ' + DATA.totals.items + ' total';
      document.getElementById('kpi-groups-delta').textContent = DATA.totals.groups + ' categories';
      document.getElementById('kpi-files-delta').textContent = DATA.totals.files + ' total';

      // sparkline: 用各 group 的 item 数生成
      const itemCounts = DATA.groups.map(g => g.items.length);
      drawSpark('kpi-items-spark', itemCounts, '#10b981');
      const fileCounts = DATA.groups.map(g => g.items.reduce((s, it) => s + (it.fileCount || 0), 0));
      drawSpark('kpi-files-spark', fileCounts, '#f59e0b');
      drawSpark('kpi-groups-spark', [DATA.totals.groups, DATA.totals.groups, DATA.totals.groups, DATA.totals.groups, DATA.totals.groups], '#4f46e5');
      drawSpark('kpi-tags-spark', Array.from(distinctTags).slice(0, 5).map((_, i, a) => a.length), '#06b6d4');

      // Last refresh
      document.getElementById('kpi-last').innerHTML = timeAgo(DATA.generatedAt) + '<br><span class="unit">ago</span>';
    }

    function drawSpark(id, values, color) {
      const svg = document.getElementById(id);
      if (!svg || !values.length) return;
      const max = Math.max(...values, 1);
      const min = Math.min(...values, 0);
      const range = Math.max(max - min, 1);
      const w = 72, h = 24, pad = 2;
      const stepX = (w - pad * 2) / Math.max(values.length - 1, 1);
      const points = values.map((v, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      svg.innerHTML = `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    function renderGroups(groups) {
      const el = document.getElementById('groups');
      const html = groups.map((g, i) => renderGroup(g, i)).join('');
      el.innerHTML = html || '<div class="empty"><h2>No assets</h2><p class="hint">Run <code>node scripts/scan-index.js</code> to scan.</p></div>';
    }

    function renderGroup(g, idx) {
      if (!g.items.length) return '';
      const groupSize = g.items.reduce((s, it) => s + (it.fileCount || 0), 0);
      const maxFileCount = Math.max(...g.items.map(it => it.fileCount || 0), 1);
      const rowsHtml = g.items.map(it => renderRow(it, maxFileCount)).join('');
      return `
        <section class="group" id="group-${escapeHtml(g.id)}" data-group="${escapeHtml(g.id)}">
          <header class="group-head">
            <span class="dot" style="background:${escapeHtml(g.color)}"></span>
            <span class="name">${escapeHtml(g.label)}</span>
            <span class="badge">GROUP_${String(idx + 1).padStart(2, '0')}</span>
            <span class="count">${g.items.length} items · ${groupSize} files</span>
          </header>
          <div class="rows">${rowsHtml}</div>
        </section>
      `;
    }

    function renderRow(it, maxFileCount) {
      const pct = Math.max(2, Math.round(((it.fileCount || 0) / maxFileCount) * 100));
      const indicator = 'ok';
      const dateStr = formatDate(it.lastModified);
      const tagsHtml = (it.tags || []).map(t =>
        `<span class="tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`
      ).join('');
      return `
        <a class="row" href="${escapeHtml(it.path)}" tabindex="0"
           data-title="${escapeHtml((it.title || '').toLowerCase())}"
           data-desc="${escapeHtml((it.desc || '').toLowerCase())}"
           data-tags="${escapeHtml((it.tags || []).join(',').toLowerCase())}"
           data-mtime="${it.lastModified || ''}">
          <span class="indicator ${indicator}"></span>
          <div class="asset">
            <div class="title">${escapeHtml(it.title || '')}</div>
            <div class="path">${escapeHtml(it.path)}</div>
          </div>
          <div class="size">${it.fileCount || 0} files</div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="date">${dateStr}</div>
          <div class="tags">${tagsHtml}</div>
        </a>
      `;
    }

    // ===== Filter / search / sort =====
    function setupFilter() {
      const searchEl = document.getElementById('search');
      const applyNow = () => applyFilter(searchEl.value.trim().toLowerCase(), getActiveTags(), currentSort());
      searchEl.addEventListener('input', applyNow);
      // Tag chips
      document.addEventListener('click', (e) => {
        const tag = e.target.closest('.tag');
        if (!tag) return;
        e.preventDefault();
        e.stopPropagation();
        tag.classList.toggle('active');
        applyNow();
      });
      // Filter buttons
      document.querySelectorAll('.filter').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyNow();
        });
      });
    }

    function currentSort() {
      const active = document.querySelector('.filter.active');
      return active ? active.dataset.filter : 'all';
    }

    function getActiveTags() {
      return Array.from(document.querySelectorAll('.tag.active'))
        .map(t => (t.dataset.tag || '').toLowerCase());
    }

    function applyFilter(query, activeTags, sort) {
      const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const rows = document.querySelectorAll('.row');
      let visible = 0;
      rows.forEach(row => {
        const matchQuery = !query ||
          (row.dataset.title || '').includes(query) ||
          (row.dataset.desc || '').includes(query) ||
          (row.dataset.tags || '').includes(query);
        const rowTags = (row.dataset.tags || '').split(',').filter(Boolean);
        const matchTags = !activeTags.length ||
          activeTags.every(t => rowTags.includes(t));
        let matchSort = true;
        if (sort === 'updated') {
          matchSort = row.dataset.mtime && new Date(row.dataset.mtime).getTime() >= sevenDaysAgo;
        } else if (sort === 'tagged') {
          matchSort = rowTags.length > 0;
        }
        const show = matchQuery && matchTags && matchSort;
        row.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      document.querySelectorAll('.group').forEach(g => {
        const anyVisible = g.querySelector('.row:not(.hidden)');
        g.classList.toggle('hidden', !anyVisible);
      });
      renderEmptyState(visible === 0, query);
    }

    function renderEmptyState(show, query) {
      let empty = document.getElementById('empty-state');
      if (show) {
        if (!empty) {
          empty = document.createElement('div');
          empty.id = 'empty-state';
          empty.className = 'empty';
          document.querySelector('main').appendChild(empty);
        }
        empty.innerHTML = `
          <h2>No matching assets</h2>
          <p class="hint">${query ? `No results for "<code>${escapeHtml(query)}</code>"` : 'Try clearing filters'}</p>
          <button class="reset-btn" id="reset-filter">Reset filters</button>
        `;
        document.getElementById('reset-filter').addEventListener('click', () => {
          document.getElementById('search').value = '';
          document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
          document.querySelector('.filter[data-filter="all"]').classList.add('active');
          applyFilter('', [], 'all');
        });
      } else if (empty) {
        empty.remove();
      }
    }

    // ===== Keyboard shortcuts =====
    function setupKeyboard() {
      let lastG = 0;
      document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        const inField = tag === 'input' || tag === 'textarea';

        if (e.key === 'Escape') {
          const s = document.getElementById('search');
          if (s.value || document.querySelectorAll('.tag.active').length) {
            s.value = '';
            document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
            applyFilter('', [], currentSort());
            e.preventDefault();
          }
          if (inField) e.target.blur();
          return;
        }
        if (e.key === '/' && !inField) {
          e.preventDefault();
          document.getElementById('search').focus();
          return;
        }
        if (e.key === 'g' && !inField) {
          const now = Date.now();
          if (now - lastG < 200) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lastG = 0;
          } else {
            lastG = now;
          }
        }
      });
    }

    // ===== Utilities =====
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function timeAgo(iso) {
      if (!iso) return 'unknown';
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h`;
      const d = Math.floor(h / 24);
      return `${d}d`;
    }
    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toISOString().slice(0, 10);
    }
  </script>
</body>
</html>
