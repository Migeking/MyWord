<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWord · content-hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --soft: #eef1f5;
    --line: #e2e6ed;
    --line-soft: #eef1f5;
    --ink: #1a1f2e;
    --ink-soft: #4a5266;
    --ink-faint: #8a92a6;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --info: #3b82f6;
    --accent: #4f46e5;
    --video: #ec4899;
    --audio: #f59e0b;
    --image: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 24px 32px 60px;
    min-height: 100vh;
  }

  /* ===== Top bar ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: white;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.4);
  }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .ver {
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .topbar-right .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ok);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .topbar-right .live::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 var(--ok);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .topbar-right .ts { color: var(--ink-faint); font-size: 12px; }

  /* ===== KPI grid ===== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .kpi .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .kpi .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .kpi .num .unit { font-size: 14px; color: var(--ink-faint); font-weight: 500; }
  .kpi .delta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .kpi .delta.ok { color: var(--ok); }
  .kpi .delta.warn { color: var(--warn); }
  .kpi .delta.info { color: var(--info); }
  .kpi .delta.violet { color: var(--video); }
  .kpi .delta.cyan { color: var(--image); }
  .kpi .spark {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 72px;
    height: 24px;
    opacity: 0.85;
  }
  .kpi .bar-mini {
    margin-top: 10px;
    height: 4px;
    background: var(--soft);
    border-radius: 2px;
    display: flex;
    gap: 1px;
    overflow: hidden;
  }
  .kpi .bar-mini span { display: block; height: 100%; }
  .kpi .bar-mini .v-html { background: #06b6d4; }
  .kpi .bar-mini .v-md { background: #4f46e5; }
  .kpi .bar-mini .v-video { background: #ec4899; }
  .kpi .bar-mini .v-audio { background: #f59e0b; }
  .kpi .bar-mini .v-image { background: #10b981; }
  .kpi .bar-mini .v-other { background: #94a3b8; }

  /* ===== Toolbar ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 240px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .search .icon { color: var(--ink-faint); font-size: 14px; }
  .search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search .kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .toolbar .divider { width: 1px; height: 20px; background: var(--line); }
  .toolbar .filter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
  }
  .toolbar .filter:hover { background: var(--soft); }
  .toolbar .filter.active {
    background: var(--accent);
    color: white;
  }
  .toolbar .filter .icon { font-size: 11px; }

  /* ===== Group card ===== */
  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }
  .group-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .group-head .name { font-weight: 600; font-size: 13px; }
  .group-head .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--card);
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .group-head .desc {
    color: var(--ink-soft);
    font-size: 12px;
    margin-left: 8px;
  }
  .group-head .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* ===== Sub-group (nested) ===== */
  .subgroup {
    background: var(--bg);
    border-top: 1px solid var(--line-soft);
    padding: 0;
  }
  .subgroup-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.02);
    border-bottom: 1px dashed var(--line);
  }
  .subgroup-head .dot { width: 6px; height: 6px; border-radius: 50%; }
  .subgroup-head .name {
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .subgroup-head .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
  }

  /* ===== Row (asset) ===== */
  .row {
    display: grid;
    grid-template-columns: 64px 16px 1fr 70px 80px 90px auto;
    gap: 12px;
    padding: 8px 12px;
    align-items: center;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
    transition: background 0.1s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(79, 70, 229, 0.04); }

  .row .thumb {
    width: 64px;
    height: 36px;
    border-radius: 4px;
    background: var(--soft);
    overflow: hidden;
    position: relative;
    display: block;
  }
  .row .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .row .thumb .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .row .thumb .type-badge {
    position: absolute;
    bottom: 2px;
    left: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: white;
    background: rgba(0, 0, 0, 0.7);
    padding: 1px 4px;
    border-radius: 2px;
  }

  .row .indicator { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
  .row .indicator.ok { background: var(--ok); }
  .row .indicator.warn { background: var(--warn); }
  .row .indicator.err { background: var(--err); }
  .row .indicator.dim { background: var(--ink-faint); }

  .row .asset { min-width: 0; }
  .row .asset .title {
    font-weight: 500;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .asset .path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .size {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }
  .row .files {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
  }
  .row .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .row .tags {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .row .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--soft);
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 2px 6px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    user-select: none;
  }
  .row .tag:hover { background: var(--accent); color: white; }
  .row .tag.active { background: var(--accent); color: white; }

  /* Media type filter badges (in row.tags) */
  .row .tag.t-video { background: rgba(236, 72, 153, 0.12); color: var(--video); }
  .row .tag.t-audio { background: rgba(245, 158, 11, 0.12); color: var(--audio); }
  .row .tag.t-image { background: rgba(6, 182, 212, 0.12); color: var(--image); }
  .row .tag.t-html { background: rgba(6, 182, 212, 0.12); color: var(--image); }
  .row .tag.t-md { background: rgba(79, 70, 229, 0.12); color: var(--accent); }
  .row .tag.t-other { background: rgba(148, 163, 184, 0.12); color: var(--ink-faint); }

  /* ===== Empty / Fatal ===== */
  .empty, .fatal {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty h2, .fatal h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }
  .empty code, .fatal code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--soft);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
  }
  .empty .hint, .fatal .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .reset-btn {
    cursor: pointer;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 6px 16px;
    margin-top: 16px;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.1s;
  }
  .reset-btn:hover { background: var(--accent); color: white; }

  /* ===== Loading ===== */
  .loading {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--ink-faint);
  }

  /* ===== Hidden ===== */
  .row.hidden { display: none; }
  .group.hidden { display: none; }

  /* ===== Responsive ===== */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .row { grid-template-columns: 48px 1fr 70px 80px 90px auto; }
    .row .indicator { display: none; }
  }
  @media (max-width: 800px) {
    body { padding: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr; gap: 8px; padding: 12px 16px; }
    .row .thumb, .row .indicator { display: none; }
    .row .size, .row .files, .row .date, .row .tags { text-align: left; }
  }
  @media (max-width: 500px) {
    .kpi-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <!-- ===== Top bar ===== -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <h1>MyWord<span class="ver">v2.0.0</span></h1>
    </div>
    <div class="topbar-right">
      <span class="live">Live</span>
      <span>·</span>
      <span class="ts" id="last-refresh">—</span>
    </div>
  </div>

  <!-- ===== KPI grid ===== -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="label">Items</div>
      <div class="num" id="kpi-items">—</div>
      <div class="delta" id="kpi-items-delta">—</div>
    </div>
    <div class="kpi">
      <div class="label">Total Size</div>
      <div class="num" id="kpi-size">—</div>
      <div class="delta">on disk</div>
    </div>
    <div class="kpi">
      <div class="label">Video · Audio · Image</div>
      <div class="num" id="kpi-media" style="font-size:18px;line-height:1.3;padding-top:4px;">—</div>
      <div class="bar-mini" id="kpi-bytype"></div>
    </div>
    <div class="kpi">
      <div class="label">With Posters</div>
      <div class="num" id="kpi-posters">—</div>
      <div class="delta violet" id="kpi-posters-pct">—</div>
    </div>
    <div class="kpi">
      <div class="label">Last Refresh</div>
      <div class="num" id="kpi-last" style="font-size:22px;line-height:1.4;padding-top:4px;">—</div>
      <div class="delta">auto-scan 5m</div>
    </div>
  </div>

  <!-- ===== Toolbar ===== -->
  <div class="toolbar">
    <div class="search">
      <span class="icon">⌕</span>
      <input type="text" id="search" placeholder="Search assets by name, description, tag, or path...">
      <span class="kbd">/</span>
    </div>
    <span class="divider"></span>
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="video"><span class="icon" style="color:var(--video);">●</span> Video</button>
    <button class="filter" data-filter="audio"><span class="icon" style="color:var(--audio);">●</span> Audio</button>
    <button class="filter" data-filter="image"><span class="icon" style="color:var(--image);">●</span> Image</button>
    <button class="filter" data-filter="tagged">Has tags</button>
  </div>

  <!-- ===== Groups ===== -->
  <main id="groups" aria-live="polite">
    <div class="loading">Loading data.json…</div>
  </main>

  <script>
    (async function main() {
      const groupsEl = document.getElementById('groups');

      try {
        const res = await fetch('./data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const DATA = await res.json();
        renderAll(DATA);
        setupFilter();
        setupKeyboard();
      } catch (err) {
        groupsEl.innerHTML = `
          <div class="fatal">
            <h2>Failed to load <code>data.json</code></h2>
            <p class="hint">${escapeHtml(err.message)}</p>
            <p class="hint">Run in project root: <code>node scripts/scan-index.js</code></p>
          </div>`;
      }
    })();

    function renderAll(DATA) {
      renderKpis(DATA);
      renderTopbar(DATA);
      renderGroups(DATA.groups);
    }

    function renderTopbar(DATA) {
      document.getElementById('last-refresh').textContent = 'Last refresh ' + timeAgo(DATA.generatedAt);
    }

    function renderKpis(DATA) {
      const t = DATA.totals;
      document.getElementById('kpi-items').textContent = t.items;
      const itemsDelta = document.getElementById('kpi-items-delta');
      itemsDelta.textContent = `${t.groups} groups · ${t.files.toLocaleString()} files`;
      itemsDelta.className = 'delta ok';

      document.getElementById('kpi-size').innerHTML = `${t.sizeFormatted}`;

      const v = t.byType.video, a = t.byType.audio, i = t.byType.image;
      document.getElementById('kpi-media').innerHTML = `<span style="color:var(--video);">${v}</span> · <span style="color:var(--audio);">${a}</span> · <span style="color:var(--image);">${i.toLocaleString()}</span>`;

      // Mini stacked bar — show file-type breakdown
      const total = v + t.byType.audio + i + t.byType.html + t.byType.md + t.byType.json + t.byType.other;
      const seg = (cls, n) => n > 0 ? `<span class="${cls}" style="width:${(n / total * 100).toFixed(2)}%"></span>` : '';
      const barEl = document.getElementById('kpi-bytype');
      barEl.innerHTML =
        seg('v-image', i) + seg('v-video', v) + seg('v-audio', a) +
        seg('v-html', t.byType.html) + seg('v-md', t.byType.md) +
        seg('v-other', t.byType.json + t.byType.other);

      const p = t.withPoster;
      document.getElementById('kpi-posters').textContent = `${p}/${t.items}`;
      const pct = t.items > 0 ? Math.round(p / t.items * 100) : 0;
      const pctEl = document.getElementById('kpi-posters-pct');
      pctEl.textContent = `${pct}% have thumbnails`;
      pctEl.className = pct >= 50 ? 'delta ok' : (pct >= 25 ? 'delta warn' : 'delta');

      document.getElementById('kpi-last').innerHTML = timeAgo(DATA.generatedAt) + '<br><span class="unit">ago</span>';
    }

    function renderGroups(groups) {
      const el = document.getElementById('groups');
      const html = groups.map((g, i) => renderGroup(g, i)).join('');
      el.innerHTML = html || '<div class="empty"><h2>No assets</h2><p class="hint">Run <code>node scripts/scan-index.js</code> to scan.</p></div>';
    }

    function renderGroup(g, idx) {
      if (!g.items.length && !(g.subGroups && g.subGroups.length)) return '';
      const itemsHtml = g.items.map(it => renderRow(it, g)).join('');
      const subHtml = (g.subGroups || []).map(sg => renderSubGroup(sg, g)).join('');
      const totalItems = g.items.length + (g.subGroups || []).reduce((s, sg) => s + sg.items.length, 0);
      const totalFiles = g.items.reduce((s, it) => s + (it.media?.total || 0), 0) +
        (g.subGroups || []).reduce((s, sg) => s + sg.items.reduce((s2, it) => s2 + (it.media?.total || 0), 0), 0);
      const totalSize = g.items.reduce((s, it) => s + (it.size || 0), 0) +
        (g.subGroups || []).reduce((s, sg) => s + sg.items.reduce((s2, it) => s2 + (it.size || 0), 0), 0);
      return `
        <section class="group" id="group-${escapeHtml(g.id)}" data-group="${escapeHtml(g.id)}">
          <header class="group-head">
            <span class="dot" style="background:${escapeHtml(g.color)}"></span>
            <span class="name">${escapeHtml(g.label)}</span>
            <span class="badge">GROUP_${String(idx + 1).padStart(2, '0')}</span>
            <span class="desc">${escapeHtml(g.description || '')}</span>
            <span class="count">${totalItems} items · ${totalFiles.toLocaleString()} files · ${formatSize(totalSize)}</span>
          </header>
          <div class="rows">${itemsHtml}${subHtml}</div>
        </section>
      `;
    }

    function renderSubGroup(sg, parent) {
      if (!sg.items.length) return '';
      const totalFiles = sg.items.reduce((s, it) => s + (it.media?.total || 0), 0);
      const totalSize = sg.items.reduce((s, it) => s + (it.size || 0), 0);
      const rowsHtml = sg.items.map(it => renderRow(it, parent)).join('');
      return `
        <div class="subgroup">
          <header class="subgroup-head">
            <span class="dot" style="background:${escapeHtml(sg.color)}"></span>
            <span class="name">${escapeHtml(sg.label)}</span>
            <span class="count">${sg.items.length} items · ${totalFiles.toLocaleString()} files · ${formatSize(totalSize)}</span>
          </header>
          <div class="rows">${rowsHtml}</div>
        </div>
      `;
    }

    function renderRow(it, g) {
      const indicator = getIndicator(it);
      const dateStr = formatDate(it.lastModified);
      const size = it.sizeFormatted || '0 B';
      const media = it.media || {};
      const hasPoster = !!it.poster;
      const primaryType = primaryMediaType(media);

      const tagsHtml = (it.tags || []).map(t =>
        `<span class="tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`
      ).join('');

      const mediaBadges = renderMediaBadges(media);

      return `
        <a class="row" href="${escapeHtml(it.path)}" tabindex="0"
           data-title="${escapeHtml((it.title || '').toLowerCase())}"
           data-desc="${escapeHtml((it.desc || '').toLowerCase())}"
           data-tags="${escapeHtml((it.tags || []).join(',').toLowerCase())}"
           data-mtime="${it.lastModified || ''}"
           data-types="${escapeHtml(Object.entries(media).filter(([k, v]) => v > 0 && ['video', 'audio', 'image', 'html', 'md'].includes(k)).map(([k]) => k).join(','))}">
          <span class="thumb">
            ${hasPoster
              ? `<img src="${escapeHtml(it.poster)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
              : ''}
            <span class="placeholder"${hasPoster ? ' style="display:none;"' : ''}>${(primaryType || 'FILE').slice(0, 4).toUpperCase()}</span>
            ${primaryType ? `<span class="type-badge">${primaryType}</span>` : ''}
          </span>
          <span class="indicator ${indicator}"></span>
          <div class="asset">
            <div class="title">${escapeHtml(it.title || '')}</div>
            <div class="path">${escapeHtml(it.path)}</div>
          </div>
          <div class="files">${(media.total || 0).toLocaleString()} files</div>
          <div class="size">${size}</div>
          <div class="date">${dateStr}</div>
          <div class="tags">${tagsHtml}${mediaBadges}</div>
        </a>
      `;
    }

    function primaryMediaType(media) {
      // Priority: video > image > audio > html > md
      if (media.video > 0) return 'video';
      if (media.image > 0) return 'image';
      if (media.audio > 0) return 'audio';
      if (media.html > 0) return 'html';
      if (media.md > 0) return 'md';
      if (media.json > 0) return 'json';
      return 'other';
    }

    function renderMediaBadges(media) {
      const badges = [];
      if (media.video > 0) badges.push(`<span class="tag t-video" title="视频">▶ ${media.video}</span>`);
      if (media.audio > 0) badges.push(`<span class="tag t-audio" title="音频">♪ ${media.audio}</span>`);
      if (media.image > 0) badges.push(`<span class="tag t-image" title="图片">▣ ${media.image}</span>`);
      if (media.html > 0) badges.push(`<span class="tag t-html" title="HTML">HTML ${media.html}</span>`);
      if (media.md > 0) badges.push(`<span class="tag t-md" title="Markdown">MD ${media.md}</span>`);
      return badges.join('');
    }

    function getIndicator(it) {
      const m = it.media || {};
      // 用文件数 vs mtime 简单判定：mtime < 30 天 = ok, < 90 天 = warn, 否则 = err
      if (!it.lastModified) return 'dim';
      const age = Date.now() - new Date(it.lastModified).getTime();
      const days = age / (1000 * 60 * 60 * 24);
      if (days < 30) return 'ok';
      if (days < 90) return 'warn';
      return 'err';
    }

    // ===== Filter / search =====
    function setupFilter() {
      const searchEl = document.getElementById('search');
      const applyNow = () => applyFilter(searchEl.value.trim().toLowerCase(), getActiveTags(), currentFilter());
      searchEl.addEventListener('input', applyNow);

      document.addEventListener('click', (e) => {
        const tag = e.target.closest('.tag');
        if (!tag) return;
        e.preventDefault();
        e.stopPropagation();
        tag.classList.toggle('active');
        applyNow();
      });

      document.querySelectorAll('.filter').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyNow();
        });
      });
    }

    function currentFilter() {
      const active = document.querySelector('.filter.active');
      return active ? active.dataset.filter : 'all';
    }

    function getActiveTags() {
      return Array.from(document.querySelectorAll('.tag.active'))
        .map(t => (t.dataset.tag || '').toLowerCase());
    }

    function applyFilter(query, activeTags, filter) {
      const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const rows = document.querySelectorAll('.row');
      let visible = 0;
      rows.forEach(row => {
        const matchQuery = !query ||
          (row.dataset.title || '').includes(query) ||
          (row.dataset.desc || '').includes(query) ||
          (row.dataset.tags || '').includes(query);
        const rowTags = (row.dataset.tags || '').split(',').filter(Boolean);
        const matchTags = !activeTags.length ||
          activeTags.every(t => rowTags.includes(t));
        let matchType = true;
        if (['video', 'audio', 'image'].includes(filter)) {
          matchType = (row.dataset.types || '').includes(filter);
        } else if (filter === 'tagged') {
          matchType = rowTags.length > 0;
        }
        const show = matchQuery && matchTags && matchType;
        row.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      document.querySelectorAll('.group, .subgroup').forEach(g => {
        const anyVisible = g.querySelector('.row:not(.hidden)');
        g.classList.toggle('hidden', !anyVisible);
      });
      renderEmptyState(visible === 0, query);
    }

    function renderEmptyState(show, query) {
      let empty = document.getElementById('empty-state');
      if (show) {
        if (!empty) {
          empty = document.createElement('div');
          empty.id = 'empty-state';
          empty.className = 'empty';
          document.querySelector('main').appendChild(empty);
        }
        empty.innerHTML = `
          <h2>No matching assets</h2>
          <p class="hint">${query ? `No results for "<code>${escapeHtml(query)}</code>"` : 'Try clearing filters'}</p>
          <button class="reset-btn" id="reset-filter">Reset filters</button>
        `;
        document.getElementById('reset-filter').addEventListener('click', () => {
          document.getElementById('search').value = '';
          document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
          document.querySelector('.filter[data-filter="all"]').classList.add('active');
          applyFilter('', [], 'all');
        });
      } else if (empty) {
        empty.remove();
      }
    }

    // ===== Keyboard shortcuts =====
    function setupKeyboard() {
      let lastG = 0;
      document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        const inField = tag === 'input' || tag === 'textarea';

        if (e.key === 'Escape') {
          const s = document.getElementById('search');
          if (s.value || document.querySelectorAll('.tag.active').length) {
            s.value = '';
            document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
            applyFilter('', [], currentFilter());
            e.preventDefault();
          }
          if (inField) e.target.blur();
          return;
        }
        if (e.key === '/' && !inField) {
          e.preventDefault();
          document.getElementById('search').focus();
          return;
        }
        if (e.key === 'g' && !inField) {
          const now = Date.now();
          if (now - lastG < 200) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lastG = 0;
          } else {
            lastG = now;
          }
        }
      });
    }

    // ===== Utilities =====
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function timeAgo(iso) {
      if (!iso) return 'unknown';
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h`;
      const d = Math.floor(h / 24);
      return `${d}d`;
    }
    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toISOString().slice(0, 10);
    }
    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 ? 1 : 0)} ${units[i]}`;
    }
  </script>
</body>
