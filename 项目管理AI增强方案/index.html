<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无人机智能管控平台 · AI 增强项目管理方案 v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bg: #0A0E1A;
  --bg-elev: #131825;
  --bg-elev-2: #1A2236;
  --bg-elev-3: #232C44;
  --border: #1F2940;
  --border-strong: #2D3A5C;
  --border-soft: #1A2236;
  --text: #E8ECF1;
  --text-mute: #94A3B8;
  --text-faint: #64748B;
  --text-dim: #475569;

  --waterfall: #3B82F6;
  --waterfall-2: #60A5FA;
  --waterfall-glow: rgba(59,130,246,.18);

  --agile: #F59E0B;
  --agile-2: #FBBF24;
  --agile-glow: rgba(245,158,11,.18);

  --ai: #06B6D4;
  --ai-2: #22D3EE;
  --ai-deep: #0E7490;
  --ai-glow: rgba(6,182,212,.20);

  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --critical: #DC2626;

  --grid-line: rgba(148,163,184,.05);
  --shadow-card: 0 1px 0 rgba(255,255,255,.04) inset, 0 16px 40px -20px rgba(0,0,0,.6);

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
  --r-xl: 22px;

  --f-display: 'Anton', 'Noto Serif SC', serif;
  --f-serif: 'Noto Serif SC', serif;
  --f-body: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}

/* =========================================================
   RESET
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
*:before,*:after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(59,130,246,.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 10%, rgba(6,182,212,.06), transparent 60%);
  background-size: 48px 48px, 48px 48px, 100% 100%, 100% 100%;
  background-attachment: fixed;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* =========================================================
   LAYOUT SHELL
   ========================================================= */
.app {
  display: grid;
  grid-template-columns: 88px 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header header"
    "rail   main"
    "footer footer";
  min-height: 100vh;
}
.masthead { grid-area: header; }
.phase-rail { grid-area: rail; }
.main { grid-area: main; padding: 0 56px 96px 56px; max-width: 1440px; }
.footer { grid-area: footer; }

/* =========================================================
   MASTHEAD
   ========================================================= */
.masthead {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,14,26,.85);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.masthead__inner {
  max-width: 1680px;
  margin: 0 auto;
  padding: 22px 56px 0 56px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 40px;
}
.masthead__brand { display: grid; grid-template-columns: auto 1fr; column-gap: 18px; row-gap: 2px; align-items: end; padding-bottom: 18px; }
.masthead__index {
  grid-row: 1 / span 2;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--text-faint);
  align-self: end;
  padding-bottom: 6px;
  border-right: 1px solid var(--border-strong);
  padding-right: 18px;
}
.masthead__title {
  font-family: var(--f-serif);
  font-weight: 900;
  font-size: 32px;
  line-height: 1.1;
  letter-spacing: -.01em;
  color: var(--text);
}
.masthead__subtitle {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 4px;
}
.masthead__title em { font-style: normal; color: var(--ai); }

.tabs {
  display: flex;
  gap: 4px;
  padding-bottom: 0;
  align-self: end;
}
.tab {
  position: relative;
  padding: 18px 18px 22px 18px;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-faint);
  transition: color .2s ease;
  display: flex; align-items: center; gap: 8px;
}
.tab .tab__num { color: var(--text-dim); font-weight: 500; }
.tab:hover { color: var(--text-mute); }
.tab[data-active] { color: var(--text); }
.tab[data-active]:after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, var(--waterfall), var(--ai));
}

/* =========================================================
   PHASE RAIL (left vertical progress)
   ========================================================= */
.phase-rail {
  border-right: 1px solid var(--border);
  background: rgba(19,24,37,.5);
  position: sticky; top: 110px; align-self: start;
  height: calc(100vh - 110px);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 28px 0 28px 0;
}
.phase-rail__label {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 20px;
}
.phase-rail__steps { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.phase-rail__step {
  position: relative;
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--text-faint);
  transition: all .25s ease;
  cursor: pointer;
}
.phase-rail__step:hover { color: var(--text); border-color: var(--ai); }
.phase-rail__step[data-active] {
  color: var(--bg);
  background: var(--ai);
  border-color: var(--ai);
  box-shadow: 0 0 0 4px var(--ai-glow);
}
.phase-rail__step[data-state="done"] {
  color: var(--bg);
  background: var(--waterfall);
  border-color: var(--waterfall);
}
.phase-rail__step[data-state="done"][data-tone="agile"] { background: var(--agile); border-color: var(--agile); }
.phase-rail__connector {
  width: 1px; height: 14px;
  background: var(--border-strong);
}
.phase-rail__legend {
  margin-top: 20px;
  display: flex; flex-direction: column; gap: 6px;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: .12em;
  color: var(--text-faint);
  text-transform: uppercase;
  align-items: center;
}
.phase-rail__legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.phase-rail__legend .lg-w { background: var(--waterfall); }
.phase-rail__legend .lg-a { background: var(--agile); }
.phase-rail__legend .lg-i { background: var(--ai); }

/* =========================================================
   FOOTER
   ========================================================= */
.footer {
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 20px 56px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.footer strong { color: var(--text-mute); font-weight: 500; }

/* =========================================================
   SECTION COMMONS
   ========================================================= */
.section { display: none; animation: fadeUp .4s cubic-bezier(.2,.8,.2,1); }
.section[data-active] { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.section__header { padding: 56px 0 36px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
.section__eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--ai);
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px;
}
.section__eyebrow:before { content: ''; width: 28px; height: 1px; background: var(--ai); }
.section__title {
  font-family: var(--f-serif);
  font-weight: 900;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -.02em;
  margin-bottom: 16px;
  color: var(--text);
}
.section__title em { font-style: normal; color: var(--ai); }
.section__lede {
  font-size: 16px;
  color: var(--text-mute);
  max-width: 760px;
  line-height: 1.7;
}
.section__lede strong { color: var(--text); font-weight: 600; }

/* =========================================================
   OVERVIEW
   ========================================================= */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; margin-bottom: 64px; }
.hero__main { display: flex; flex-direction: column; gap: 24px; }
.hero__quote {
  font-family: var(--f-serif);
  font-weight: 700;
  font-size: 28px;
  line-height: 1.35;
  color: var(--text);
  border-left: 3px solid var(--ai);
  padding-left: 20px;
}
.hero__quote em { color: var(--ai-2); font-style: normal; }
.hero__desc { color: var(--text-mute); font-size: 15px; max-width: 640px; }
.hero__pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
.pillar {
  border: 1px solid var(--border);
  background: var(--bg-elev);
  border-radius: var(--r-lg);
  padding: 20px;
  position: relative;
  transition: all .2s ease;
}
.pillar:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.pillar__num { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); }
.pillar__name { font-family: var(--f-serif); font-weight: 900; font-size: 22px; margin: 6px 0 4px 0; }
.pillar__name--w { color: var(--waterfall-2); }
.pillar__name--a { color: var(--agile-2); }
.pillar__name--i { color: var(--ai-2); }
.pillar__desc { font-size: 12.5px; color: var(--text-mute); line-height: 1.6; }
.pillar__chip {
  position: absolute; top: 18px; right: 18px;
  width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px;
}
.pillar__chip--w { background: var(--waterfall-glow); color: var(--waterfall-2); border: 1px solid var(--waterfall); }
.pillar__chip--a { background: var(--agile-glow); color: var(--agile-2); border: 1px solid var(--agile); }
.pillar__chip--i { background: var(--ai-glow); color: var(--ai-2); border: 1px solid var(--ai); }

.hero__side { display: flex; flex-direction: column; gap: 16px; }
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kpi {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 18px 20px 18px;
  position: relative;
  overflow: hidden;
}
.kpi__label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }
.kpi__value {
  font-family: var(--f-display);
  font-size: 44px;
  line-height: 1;
  margin: 10px 0 4px 0;
  color: var(--text);
  letter-spacing: -.02em;
}
.kpi__value em { color: var(--ai); font-style: normal; font-size: 22px; vertical-align: top; }
.kpi__unit { font-family: var(--f-mono); font-size: 11px; color: var(--text-faint); letter-spacing: .12em; }
.kpi__delta {
  margin-top: 8px;
  font-family: var(--f-mono); font-size: 10px;
  color: var(--success);
}
.kpi__delta--down { color: var(--danger); }

/* Triangle / Model diagram */
.diagram {
  border: 1px solid var(--border);
  background: var(--bg-elev);
  border-radius: var(--r-xl);
  padding: 36px 40px 44px 40px;
  margin-bottom: 64px;
  position: relative;
}
.diagram__head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; }
.diagram__title {
  font-family: var(--f-serif); font-weight: 900; font-size: 28px;
}
.diagram__sub { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }
.diagram__svg { width: 100%; height: 360px; }

/* Comparison table */
.cmp { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 0; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.cmp__cell { padding: 18px 20px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
.cmp__cell:last-child { border-right: 0; }
.cmp__cell--head {
  background: var(--bg-elev-2);
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--text-faint);
}
.cmp__cell--head h4 { color: var(--text); font-size: 13px; margin-top: 4px; letter-spacing: .1em; }
.cmp__cell--row-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .15em; color: var(--text-faint); text-transform: uppercase; }
.cmp__cell--row-label h4 { color: var(--text); font-size: 15px; margin-top: 4px; letter-spacing: 0; text-transform: none; font-family: var(--f-body); font-weight: 500; }
.cmp__cell p { font-size: 13px; color: var(--text-mute); line-height: 1.6; }
.cmp__cell--best { background: var(--ai-glow); }
.cmp__cell--best p { color: var(--text); }
.cmp__row:last-child .cmp__cell { border-bottom: 0; }

/* =========================================================
   LIFECYCLE
   ========================================================= */
.lifecycle__rail {
  position: relative;
  padding: 0 0 0 80px;
  margin-bottom: 32px;
}
.lifecycle__node {
  position: relative;
  padding: 28px 0 28px 32px;
  border-left: 1px solid var(--border-strong);
  margin-left: 0;
}
.lifecycle__node:last-child { padding-bottom: 0; }
.lifecycle__node:before {
  content: ''; position: absolute; left: -7px; top: 36px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--waterfall);
}
.lifecycle__node[data-tone="plan"]:before { border-color: var(--waterfall); }
.lifecycle__node[data-tone="exec"]:before { border-color: var(--agile); }
.lifecycle__node[data-tone="mon"]:before { border-color: var(--ai); }
.lifecycle__node[data-tone="close"]:before { border-color: var(--success); }

.lifecycle__phase-band {
  position: absolute; left: 0; top: 28px;
  width: 64px; text-align: right;
}
.lifecycle__phase-band .pb__num {
  font-family: var(--f-display); font-size: 32px; line-height: 1; color: var(--text-faint);
}
.lifecycle__phase-band .pb__name {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim);
  margin-top: 4px;
}
.lifecycle__node[data-tone="plan"] .pb__num { color: var(--waterfall-2); }
.lifecycle__node[data-tone="exec"] .pb__num { color: var(--agile-2); }
.lifecycle__node[data-tone="mon"] .pb__num { color: var(--ai-2); }
.lifecycle__node[data-tone="close"] .pb__num { color: var(--success); }

.lifecycle__head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 20px; gap: 24px; flex-wrap: wrap; }
.lifecycle__code { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--text-faint); }
.lifecycle__name { font-family: var(--f-serif); font-weight: 900; font-size: 32px; line-height: 1.15; }
.lifecycle__name em { color: var(--ai); font-style: normal; }
.lifecycle__badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 8px; border-radius: var(--r-sm);
  background: var(--bg-elev); border: 1px solid var(--border);
  color: var(--text-mute);
}
.badge--w { color: var(--waterfall-2); border-color: var(--waterfall); }
.badge--a { color: var(--agile-2); border-color: var(--agile); }
.badge--i { color: var(--ai-2); border-color: var(--ai); }

.lifecycle__body { display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; }
.lifecycle__col { display: flex; flex-direction: column; gap: 16px; }
.lc-block {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
}
.lc-block__head {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 10px;
}
.lc-block__head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.lc-block__head .dot--w { background: var(--waterfall); }
.lc-block__head .dot--a { background: var(--agile); }
.lc-block__head .dot--g { background: var(--success); }
.lc-block__head .dot--r { background: var(--danger); }
.lc-block ul { display: flex; flex-direction: column; gap: 6px; }
.lc-block li { font-size: 13.5px; color: var(--text-mute); padding-left: 14px; position: relative; line-height: 1.55; }
.lc-block li:before { content: '—'; position: absolute; left: 0; color: var(--text-dim); }
.lc-block__work li { color: var(--text); }

.role-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 11.5px;
  color: var(--text-mute);
  margin: 0 6px 6px 0;
}
.role-pill .raci {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em;
  padding: 1px 5px; border-radius: 2px;
  background: var(--bg-elev-3); color: var(--ai-2);
}
.role-pill .raci--ar { color: var(--text); background: var(--ai-glow); border: 1px solid var(--ai); }
.role-pill .raci--r { color: var(--agile-2); background: var(--agile-glow); }
.role-pill .raci--c { color: var(--text-mute); }
.role-pill .raci--i { color: var(--text-dim); }

/* =========================================================
   AGILE
   ========================================================= */
.agile__intro { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; margin-bottom: 40px; }
.agile__intro-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 28px;
}
.agile__intro-card h3 { font-family: var(--f-serif); font-weight: 900; font-size: 22px; margin-bottom: 12px; }
.agile__intro-card p { color: var(--text-mute); font-size: 14px; line-height: 1.7; }
.agile__intro-card em { color: var(--ai-2); font-style: normal; font-weight: 600; }
.agile__principle {
  display: flex; gap: 14px; align-items: start;
  padding: 12px 0; border-bottom: 1px dashed var(--border);
}
.agile__principle:last-child { border-bottom: 0; }
.agile__principle .pp__num {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .15em; color: var(--agile);
  width: 24px; flex-shrink: 0; padding-top: 1px;
}
.agile__principle .pp__text { font-size: 13.5px; color: var(--text-mute); line-height: 1.6; }
.agile__principle .pp__text strong { color: var(--text); font-weight: 500; }

.iter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.iter-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 24px 26px 24px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  transition: all .25s ease;
}
.iter-card:hover { border-color: var(--agile); transform: translateY(-3px); }
.iter-card[data-active] { border-color: var(--agile); background: linear-gradient(180deg, var(--agile-glow), transparent 80%); }
.iter-card__head { display: flex; justify-content: space-between; align-items: start; }
.iter-card__num { font-family: var(--f-display); font-size: 36px; line-height: 1; color: var(--agile-2); }
.iter-card__label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }
.iter-card__name { font-family: var(--f-serif); font-weight: 900; font-size: 20px; line-height: 1.2; }
.iter-card__name em { color: var(--agile-2); font-style: normal; }
.iter-card__goal { font-size: 13px; color: var(--text-mute); line-height: 1.6; padding-top: 8px; border-top: 1px dashed var(--border); }
.iter-card__goal strong { color: var(--text); font-weight: 500; }
.iter-card__list { display: flex; flex-direction: column; gap: 4px; }
.iter-card__list li { font-size: 12.5px; color: var(--text-mute); padding-left: 14px; position: relative; line-height: 1.5; }
.iter-card__list li:before { content: '›'; position: absolute; left: 0; color: var(--agile); }
.iter-card__foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; color: var(--text-faint); text-transform: uppercase; }
.iter-card__foot strong { color: var(--agile-2); font-weight: 500; }

/* =========================================================
   AI DECISIONS
   ========================================================= */
.ai-intro {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 36px 40px;
  margin-bottom: 48px;
  position: relative;
  overflow: hidden;
}
.ai-intro:before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--ai), var(--ai-deep));
}
.ai-intro h3 { font-family: var(--f-serif); font-weight: 900; font-size: 30px; margin-bottom: 14px; line-height: 1.2; }
.ai-intro h3 em { color: var(--ai-2); font-style: normal; }
.ai-intro p { color: var(--text-mute); font-size: 14.5px; line-height: 1.7; margin-bottom: 14px; }
.ai-intro p strong { color: var(--text); font-weight: 500; }
.ai-intro__features { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--bg); border-radius: var(--r-md); border: 1px solid var(--border); }
.ai-intro__features li { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-mute); }
.ai-intro__features i { width: 6px; height: 6px; background: var(--ai); display: inline-block; flex-shrink: 0; }

.ai-pipeline {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 40px 40px 36px 40px;
  margin-bottom: 48px;
}
.ai-pipeline__head { margin-bottom: 28px; }
.ai-pipeline__title { font-family: var(--f-serif); font-weight: 900; font-size: 28px; }
.ai-pipeline__title em { color: var(--ai-2); font-style: normal; }
.ai-pipeline__sub { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; color: var(--text-faint); text-transform: uppercase; margin-top: 6px; }
.ai-pipeline__svg { width: 100%; height: 220px; }

.decision-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.decision-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px 24px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  transition: all .25s ease;
}
.decision-card:hover { border-color: var(--ai); transform: translateY(-2px); box-shadow: 0 0 0 1px var(--ai-glow); }
.decision-card__head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.decision-card__id {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em;
  padding: 3px 7px; border-radius: var(--r-sm);
  background: var(--ai-glow); color: var(--ai-2); border: 1px solid var(--ai);
  text-transform: uppercase;
}
.decision-card__stage {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; color: var(--text-faint);
  text-transform: uppercase;
  text-align: right;
}
.decision-card__stage strong { color: var(--ai-2); font-weight: 500; display: block; }
.decision-card__name { font-family: var(--f-serif); font-weight: 900; font-size: 19px; line-height: 1.3; }
.decision-card__row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: start; }
.decision-card__row .key {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; color: var(--text-faint);
  text-transform: uppercase; padding-top: 3px;
}
.decision-card__row .val { font-size: 13px; color: var(--text-mute); line-height: 1.6; }
.decision-card__row .val strong { color: var(--text); font-weight: 500; }
.decision-card__row .val--ai { color: var(--ai-2); }
.decision-card__row .val--ok { color: var(--success); }
.decision-card__row .val--warn { color: var(--warning); }
.decision-card__row .val--risk { color: var(--danger); }

.confidence-bar {
  display: flex; align-items: center; gap: 10px; margin-top: 2px;
}
.confidence-bar__track { flex: 1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.confidence-bar__fill { height: 100%; background: linear-gradient(90deg, var(--ai), var(--ai-2)); border-radius: 2px; }
.confidence-bar__num { font-family: var(--f-mono); font-size: 12px; color: var(--ai-2); font-weight: 500; }

/* Decision log table */
.ai-log {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 28px;
  margin-top: 32px;
}
.ai-log__head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 20px; }
.ai-log__title { font-family: var(--f-serif); font-weight: 900; font-size: 22px; }
.ai-log__title em { color: var(--ai-2); font-style: normal; }
.ai-log__sub { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }
.ai-log__table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ai-log__table th {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--text-faint); text-align: left;
  padding: 10px 12px; border-bottom: 1px solid var(--border-strong);
}
.ai-log__table td {
  padding: 12px 12px; border-bottom: 1px solid var(--border-soft);
  color: var(--text-mute);
}
.ai-log__table td.id { font-family: var(--f-mono); color: var(--ai-2); }
.ai-log__table td.conf { font-family: var(--f-mono); color: var(--ai-2); }
.ai-log__table td.action {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--r-sm); text-align: center; display: inline-block;
}
.ai-log__table td.action--accept { background: var(--ai-glow); color: var(--ai-2); border: 1px solid var(--ai); }
.ai-log__table td.action--override { background: rgba(245,158,11,.15); color: var(--agile-2); border: 1px solid var(--agile); }
.ai-log__table td.action--reject { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid var(--danger); }

/* =========================================================
   RACI
   ========================================================= */
.raci-wrap {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 28px;
  margin-bottom: 24px;
  overflow-x: auto;
}
.raci-table { width: 100%; border-collapse: collapse; min-width: 920px; }
.raci-table th, .raci-table td {
  padding: 12px 14px; border: 1px solid var(--border-soft);
  font-size: 12.5px; text-align: center;
}
.raci-table th {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  background: var(--bg-elev-2); color: var(--text-faint);
  font-weight: 500;
}
.raci-table th.stage-h { text-align: left; }
.raci-table td.stage {
  text-align: left; font-weight: 500; color: var(--text);
  font-family: var(--f-body); font-size: 12.5px;
  background: var(--bg-elev-2);
}
.raci-table td.stage .stage__num { display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .15em; color: var(--text-faint); margin-top: 2px; }
.raci-tag {
  display: inline-block; padding: 2px 8px;
  font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em;
  border-radius: var(--r-sm);
}
.raci-tag--ar { color: var(--bg); background: var(--ai); }
.raci-tag--r { color: var(--bg); background: var(--waterfall); }
.raci-tag--c { color: var(--text-mute); background: var(--bg-elev-3); border: 1px solid var(--border-strong); }
.raci-tag--i { color: var(--text-faint); background: var(--bg-elev); border: 1px solid var(--border); }
.raci-table td.empty { color: var(--text-dim); }
.raci-legend {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px 24px;
}
.raci-legend__item { display: flex; gap: 12px; align-items: start; }
.raci-legend__item .raci-tag { flex-shrink: 0; }
.raci-legend__item .lbl { font-family: var(--f-mono); font-size: 10px; letter-spacing: .15em; color: var(--ai-2); margin-bottom: 2px; text-transform: uppercase; }
.raci-legend__item .desc { font-size: 12.5px; color: var(--text-mute); line-height: 1.5; }

/* =========================================================
   DASHBOARD
   ========================================================= */
.dash-hero { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 32px; }
.gauge {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px 24px 24px 24px;
  position: relative;
  overflow: hidden;
}
.gauge__label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }
.gauge__name { font-family: var(--f-serif); font-weight: 900; font-size: 18px; margin: 4px 0 18px 0; line-height: 1.2; }
.gauge__viz { display: flex; align-items: center; gap: 16px; }
.gauge__ring { width: 92px; height: 92px; flex-shrink: 0; position: relative; }
.gauge__ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge__ring circle { fill: none; stroke-width: 8; }
.gauge__ring .track { stroke: var(--bg-elev-3); }
.gauge__ring .fill { stroke: var(--ai); stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
.gauge__ring[data-tone="ok"] .fill { stroke: var(--success); }
.gauge__ring[data-tone="warn"] .fill { stroke: var(--warning); }
.gauge__ring[data-tone="risk"] .fill { stroke: var(--danger); }
.gauge__num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--f-display); font-size: 26px; color: var(--text);
  line-height: 1;
}
.gauge__num em { font-size: 12px; color: var(--text-faint); margin-left: 2px; font-style: normal; }
.gauge__detail { flex: 1; }
.gauge__detail .gd__line { font-size: 12px; color: var(--text-mute); margin-bottom: 4px; }
.gauge__detail .gd__line strong { color: var(--text); font-weight: 500; }
.gauge__detail .gd__trend { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 11px; }
.gauge__detail .gd__trend--up { color: var(--success); }
.gauge__detail .gd__trend--down { color: var(--danger); }

.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.dash-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 26px;
}
.dash-card__head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
.dash-card__title { font-family: var(--f-serif); font-weight: 900; font-size: 20px; }
.dash-card__title em { color: var(--ai-2); font-style: normal; }
.dash-card__sub { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--text-faint); text-transform: uppercase; }

.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-row {
  display: grid; grid-template-columns: 60px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--warning);
  border-radius: var(--r-md);
}
.risk-row[data-level="high"] { border-left-color: var(--danger); }
.risk-row[data-level="med"] { border-left-color: var(--warning); }
.risk-row[data-level="low"] { border-left-color: var(--success); }
.risk-row__level {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--warning); text-align: center;
}
.risk-row[data-level="high"] .risk-row__level { color: var(--danger); }
.risk-row[data-level="low"] .risk-row__level { color: var(--success); }
.risk-row__text strong { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.risk-row__text span { font-size: 12px; color: var(--text-mute); }
.risk-row__text em { color: var(--ai-2); font-style: normal; }
.risk-row__ai {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 8px; background: var(--ai-glow); color: var(--ai-2);
  border: 1px solid var(--ai); border-radius: var(--r-sm);
}

.retrack-list { display: flex; flex-direction: column; gap: 8px; }
.retrack-item {
  display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start;
  padding: 10px 0; border-bottom: 1px dashed var(--border);
}
.retrack-item:last-child { border-bottom: 0; }
.retrack-item__num { font-family: var(--f-mono); font-size: 10px; color: var(--text-faint); padding-top: 2px; }
.retrack-item__text { font-size: 13px; color: var(--text-mute); line-height: 1.55; }
.retrack-item__text strong { color: var(--text); font-weight: 500; }

/* =========================================================
   SCROLLBAR
   ========================================================= */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-elev-3); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 1280px) {
  .hero { grid-template-columns: 1fr; }
  .agile__intro { grid-template-columns: 1fr; }
  .ai-intro { grid-template-columns: 1fr; }
  .iter-grid { grid-template-columns: 1fr 1fr; }
  .decision-grid { grid-template-columns: 1fr; }
  .dash-hero { grid-template-columns: 1fr 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .raci-legend { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "header" "main" "footer"; }
  .phase-rail { display: none; }
  .main { padding: 0 24px 64px 24px; }
  .masthead__inner { padding: 18px 24px 0 24px; grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; }
  .section__title { font-size: 44px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .hero__pillars { grid-template-columns: 1fr; }
  .cmp { grid-template-columns: 1fr; }
  .iter-grid { grid-template-columns: 1fr; }
  .dash-hero { grid-template-columns: 1fr; }
  .raci-legend { grid-template-columns: 1fr; }
  .lifecycle__body { grid-template-columns: 1fr; }
}
</style>
</head>

</div>

  // ============== Helpers ==============
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function raciTag(level) {
    const map = { 'A/R': 'ar', 'R': 'r', 'C': 'c', 'I': 'i' };
    const cls = map[level] || 'c';
    return `<span class="raci-tag raci-tag--${cls}">${esc(level)}</span>`;
  }

  // ============== Phase Rail ==============
  const phaseSteps = data.phases.map(p => ({
    id: p.id, num: p.num, name: p.name
  }));
  rail.innerHTML = phaseSteps.map((p,i) => `
    <div class="phase-rail__step" data-phase="${p.id}" data-active="${i === 0 ? 'true' : 'false'}" title="${esc(p.name)}">
      ${p.num}
    </div>
    ${i < phaseSteps.length - 1 ? '<div class="phase-rail__connector"></div>' : ''}
  `).join('');

  // ============== Tab switch ==============
  function activateTab(tabId) {
    [...tabs.querySelectorAll('.tab')].forEach(t => {
      t.removeAttribute('data-active');
      if (t.dataset.tab === tabId) t.setAttribute('data-active', '');
    });
    [...main.querySelectorAll('.section')].forEach(s => {
      s.removeAttribute('data-active');
      if (s.dataset.section === tabId) s.setAttribute('data-active', '');
    });
    if (location.hash !== '#' + tabId) {
      history.replaceState(null, '', '#' + tabId);
    }
    // sync rail to first phase of current tab
    syncRailToTab(tabId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabs.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) activateTab(btn.dataset.tab);
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id) activateTab(id);
  });
  function syncRailToTab(tabId) {
    const map = { lifecycle: 0, agile: 1, ai: 2, raci: 3, dashboard: 4, overview: -1 };
    const idx = map[tabId] ?? 0;
    [...rail.querySelectorAll('.phase-rail__step')].forEach((el, i) => {
      if (i === idx) el.setAttribute('data-active', 'true');

          <li><i></i>人在回路：模型可被人工覆盖，覆盖原因必填</li>
          <li><i></i>数据飞轮：每个项目真实反馈回流，下个项目决策更准</li>
          <li><i></i>边界清晰：AI 不可独立签署验收 / 不可独立变更范围</li>
        </ul>
      </div>

      <div class="ai-pipeline">
        <div class="ai-pipeline__head">
          <div class="ai-pipeline__title">决策管道 <em>· DECISION PIPELINE</em></div>
          <div class="ai-pipeline__sub">5 步闭环 · 可回放 · 可审计</div>
        </div>
        ${pipelineSvg}
      </div>

      <div class="section__eyebrow" style="margin-top: 0; margin-bottom: 18px;">19 DECISION POINTS · 决策卡全集</div>
      <div class="decision-grid">${decisionsHtml}</div>

      <div class="ai-log">
        <div class="ai-log__head">
          <div>
            <div class="ai-log__sub">DECISION LOG · 样例</div>
            <div class="ai-log__title">决策日志 <em>· 证据链</em></div>
          </div>
          <div class="ai-log__sub">近 30 天 · 共 142 条</div>
        </div>
        <table class="ai-log__table">
          <thead>
            <tr>
              <th>ID</th>
              <th>阶段</th>
              <th>触发</th>
              <th>建议摘要</th>
              <th>置信</th>
              <th>处置</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody>${logHtml}</tbody>
        </table>
      </div>
    </section>`;
  }

  // ============== Render: RACI ==============
  function renderRaci() {
    const head = `
      <thead>
        <tr>
          <th class="stage-h" style="min-width:240px;">阶段 / 工作项</th>
          <th>项目经理</th>
          <th>业务部门（客户）</th>
          <th>信息化/运维（客户）</th>
          <th>产品/研发</th>
          <th>实施工程师</th>
          <th>飞手/设备厂家</th>
        </tr>
      </thead>`;
    const rows = data.raci.map(r => `
      <tr>
        <td class="stage">${esc(r.stage)}</td>
        <td>${raciTag(r.PM)}</td>
        <td>${raciTag(r.Biz)}</td>
        <td>${raciTag(r.IT)}</td>
        <td>${raciTag(r.PD)}</td>
        <td>${raciTag(r.IMP)}</td>
        <td>${raciTag(r.Pilot)}</td>
      </tr>
    `).join('');

    return `
    <section class="section" data-section="raci">
      <div class="section__header">
        <div class="section__eyebrow">SECTION 05 · RACI 矩阵</div>
        <h2 class="section__title">10 阶段 <em>× 6 角色</em> · 责任无真空</h2>
        <p class="section__lede">RACI 矩阵明确每个节点的<strong>执行 / 负责 / 协商 / 知会</strong>四类责任，避免『谁都该做但没人做』。下方是 10 阶段 × 6 角色完整矩阵 + 标识说明。</p>
      </div>
      <div class="raci-wrap">
        <table class="raci-table">${head}<tbody>${rows}</tbody></table>
      </div>
      <div class="raci-legend">
        <div class="raci-legend__item">
          <span class="raci-tag raci-tag--ar">A/R</span>
          <div><div class="lbl">A · Accountable</div><div class="desc">最终负责。对结果确认、拍板或承担最终责任。每行有且仅有一个 A。</div></div>
        </div>
        <div class="raci-legend__item">
          <span class="raci-tag raci-tag--r">R</span>
          <div><div class="lbl">R · Responsible</div><div class="desc">负责执行。具体做事并提交产出。可有多个 R 并行。</div></div>
        </div>
        <div class="raci-legend__item">
          <span class="raci-tag raci-tag--c">C</span>
          <div><div class="lbl">C · Consulted</div><div class="desc">参与协商。提供意见、资料、接口或业务确认，双向沟通。</div></div>
        </div>
        <div class="raci-legend__item">
          <span class="raci-tag raci-tag--i">I</span>
          <div><div class="lbl">I · Informed</div><div class="desc">知会。保持同步，不直接承担交付动作，单向通知。</div></div>
        </div>
      </div>
    </section>`;
  }

  // ============== Render: DASHBOARD ==============
  function renderDashboard() {
    // gauges
    const gauge = (m, idx) => {
      const ring = 264; // 2*pi*42
      const fill = ring * (1 - Math.min(100, m.value) / 100);
      // but for value > 100 normalize
      let val = m.value;
      if (m.name === '范围变更次数') {
        // show as bar of 5
        return `
        <div class="gauge">
          <div class="gauge__label">METRIC 0${idx+1}</div>
          <div class="gauge__name">${esc(m.name)}</div>
          <div class="gauge__viz" style="align-items: stretch;">
            <div style="flex:1; display:flex; align-items:end; gap:6px; height:96px;">
              ${[0,1,2,3,4].map(i => `<div style="flex:1; background: ${i < m.value ? 'var(--warning)' : 'var(--bg-elev-3)'}; height: ${20 + i*16}%; border-radius: 2px 2px 0 0;"></div>`).join('')}
            </div>
            <div style="text-align: right;">
              <div style="font-family: var(--f-display); font-size: 44px; line-height: 1; color: var(--text);">${m.value}<em style="color: var(--text-faint); font-style: normal; font-size: 18px; margin-left: 4px;">/ 5</em></div>
              <div class="kpi__unit" style="margin-top: 4px;">${esc(m.target)}</div>
            </div>
          </div>
          <div class="gauge__detail" style="margin-top: 14px;">
            <div class="gd__line">${esc(m.note)}</div>
            <div class="gd__trend ${m.trend === 'up' ? 'gd__trend--up' : 'gd__trend--down'}">${m.trend === 'up' ? '▲' : '▼'} ${esc(m.delta)}</div>
          </div>
        </div>`;
      }
      return `
        <div class="gauge">
          <div class="gauge__label">METRIC 0${idx+1}</div>
          <div class="gauge__name">${esc(m.name)}</div>
          <div class="gauge__viz">
            <div class="gauge__ring" data-tone="${m.tone}">
              <svg viewBox="0 0 100 100">
                <circle class="track" cx="50" cy="50" r="42"/>
                <circle class="fill" cx="50" cy="50" r="42"
                  stroke-dasharray="${ring}"
                  stroke-dashoffset="${fill}"/>
              </svg>
              <div class="gauge__num">${val}<em>${m.suffix}</em></div>
            </div>
            <div class="gauge__detail">
              <div class="gd__line"><strong>目标</strong> · ${esc(m.target)}</div>
              <div class="gd__line">${esc(m.note)}</div>
              <div class="gd__trend ${m.trend === 'up' ? 'gd__trend--up' : 'gd__trend--down'}">${m.trend === 'up' ? '▲' : '▼'} ${esc(m.delta)}</div>
            </div>
          </div>
        </div>`;
    };

    const riskHtml = data.risks.map(r => `
      <div class="risk-row" data-level="${esc(r.level)}">
        <div class="risk-row__level">${r.level === 'high' ? 'HIGH' : r.level === 'med' ? 'MED' : 'LOW'}</div>
        <div class="risk-row__text">
          <strong>${esc(r.text)}</strong>
          <span>${esc(r.note)}</span>
        </div>
        <div class="risk-row__ai">⬢ ${esc(r.ai)}</div>
      </div>
    `).join('');

    const retrackHtml = data.retrack.map((t, i) => `
      <div class="retrack-item">
        <div class="retrack-item__num">0${i+1}</div>
        <div class="retrack-item__text">${esc(t)}</div>
      </div>
    `).join('');

    return `
    <section class="section" data-section="dashboard">
      <div class="section__header">
        <div class="section__eyebrow">SECTION 06 · 管控看板</div>
        <h2 class="section__title">关键 <em>指标</em> · 风险 · 复盘</h2>
        <p class="section__lede">仪表盘展示项目关键指标、风险预警、复盘清单。所有数据由 AI 决策日志与项目台账自动汇总，每项风险关联对应的 AI 决策点，可一键回溯到证据链。</p>
      </div>

      <div class="dash-hero">
        ${data.metrics.map(gauge).join('')}
      </div>

      <div class="dash-grid">
        <div class="dash-card">
          <div class="dash-card__head">
            <div>
              <div class="dash-card__sub">RISK · TOP 5</div>
              <div class="dash-card__title">风险预警 <em>· 实时</em></div>
            </div>
            <div class="dash-card__sub">每条关联 AI 决策点</div>
          </div>
          <div class="risk-list">${riskHtml}</div>
        </div>
        <div class="dash-card">
          <div class="dash-card__head">
            <div>
              <div class="dash-card__sub">RETRACK · 项目复盘</div>
              <div class="dash-card__title">沉淀 <em>· 6 项</em></div>
            </div>
            <div class="dash-card__sub">输出组织过程资产</div>
          </div>
          <div class="retrack-list">${retrackHtml}</div>
        </div>
      </div>
    </section>`;
  }

  // ============== Mount ==============
  main.innerHTML = [
    renderOverview(),
    renderLifecycle(),
    renderAgile(),
    renderAI(),
    renderRaci(),
    renderDashboard()
  ].join('');

  // initial tab from hash
  const initial = location.hash.slice(1);
  if (initial && ['overview','lifecycle','agile','ai','raci','dashboard'].includes(initial)) {
    activateTab(initial);
  } else {
    activateTab('overview');
  }

  // ============== Iter card hover ==============
  document.querySelectorAll('.iter-card').forEach(card => {
    card.addEventListener('mouseenter', () => card.setAttribute('data-active','true'));
    card.addEventListener('mouseleave', () => {
      // keep first card highlighted; others clear
      if (!card.matches('.iter-card:first-child')) card.removeAttribute('data-active');
    });
  });
})();
</script>
</body>
</html>
