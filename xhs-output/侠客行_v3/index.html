<script>
// ── Proportional timing from full.wav (consistent voice) ──
// full.wav structure:
//   0.00-1.90s: Title intro
//   1.90-24.95s: Full poem (couplets flow continuously)
//   24.95-25.20s: Silence
//   25.20-30.94s: Ending
//
// Since no silence gaps between couplets, timing is proportionally
// allocated based on individual seed=99 durations (see timing.txt)

const TIMING = {
  totalDuration: 30.94,
  slides: [
    { index: 0,  label: 'title', start: 0.00, end: 1.90 },
    { index: 1,  label: '其一',  start: 1.90, end: 4.10 },
    { index: 2,  label: '其二',  start: 4.10, end: 5.71 },
    { index: 3,  label: '其三',  start: 5.71, end: 7.62 },
    { index: 4,  label: '其四',  start: 7.62, end: 9.43 },
    { index: 5,  label: '其五',  start: 9.43, end: 11.02 },
    { index: 6,  label: '其六',  start: 11.02, end: 13.63 },
    { index: 7,  label: '其七',  start: 13.63, end: 15.38 },
    { index: 8,  label: '其八',  start: 15.38, end: 17.10 },
    { index: 9,  label: '其九',  start: 17.10, end: 19.32 },
    { index: 10, label: '其十',  start: 19.32, end: 21.06 },
    { index: 11, label: '其十一',start: 21.06, end: 23.11 },
    { index: 12, label: '其十二',start: 23.11, end: 24.95 },
    { index: 13, label: 'ending', start: 25.20, end: 30.94 }
  ]
};

const slides = document.querySelectorAll('.slide');
function showSlide(index) {
  slides.forEach((s, i) => {
    s.classList.toggle('active', i === index);
  });
}
window.showSlide = showSlide;

// ── Animation: play audio + advance slides per timing ──
const audio = new Audio('assets/full.wav');
audio.preload = 'auto';

let currentIndex = 0;
let rafId = null;

function updateSlide(time) {
  // Find which slide should be visible at this time
  for (let i = TIMING.slides.length - 1; i >= 0; i--) {
    if (time >= TIMING.slides[i].start && time < TIMING.slides[i].end) {
      if (i !== currentIndex) {
        currentIndex = i;
        showSlide(i);
      }
      return;
    }
  }
  // Past the end? show last slide
  if (time >= TIMING.totalDuration) {
    if (currentIndex !== TIMING.slides.length - 1) {
      currentIndex = TIMING.slides.length - 1;
      showSlide(currentIndex);
    }
  }
}

function startPlayback() {
  currentIndex = 0;
  showSlide(0);
  audio.currentTime = 0;
  audio.play().catch(e => console.warn('Audio play blocked:', e));

  function tick() {
    if (audio.paused || audio.ended) {
      if (audio.ended) showSlide(TIMING.slides.length - 1);
      return;
    }
    updateSlide(audio.currentTime);
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ── Controls ──
document.addEventListener('click', startPlayback);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') startPlayback();
});

// Init: show title
showSlide(0);
</script>
</body>
</html>
