<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>像素风地铁创意</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
     background:#0a0e17;color:#fff;overflow:hidden;
     width:1080px;height:1440px;position:relative}
:root{--accent:#ff6b35;--accent-light:#ff8a5c; --pixel-green: #4CAF50;}
.bg-grid{position:absolute;top:0;left:0;width:100%;height:100%;
         background-image:
           linear-gradient(rgba(255,107,53,0.05) 2px,transparent 2px),
           linear-gradient(90deg,rgba(255,107,53,0.05) 2px,transparent 2px);
         background-size:60px 60px;pointer-events:none}
.glow-dot{position:absolute;width:400px;height:400px;border-radius:50%;
          filter:blur(100px);pointer-events:none;opacity:0.25; background:var(--accent); top: 50%; left: 50%; transform: translate(-50%, -50%);}
.status-bar{position:absolute;top:0;left:0;right:0;height:4px;
            background:linear-gradient(90deg,var(--accent),var(--accent-light),var(--pixel-green),var(--accent));
            background-size:300% 100%;z-index:100; animation: scroll-bar 3s linear infinite;}
@keyframes scroll-bar { 0% {background-position: 0% 0%;} 100% {background-position: 100% 0%;} }

.slide{position:absolute;top:0;left:0;width:1080px;height:1440px;
       padding:100px 80px;display:flex;flex-direction:column;
       opacity:0;pointer-events:none; justify-content: center;}
       
.title-main{font-size:88px;font-weight:900;color:#fff;line-height:1.3; text-shadow: 0 4px 20px rgba(0,0,0,0.5);}
.title-main .ac{color:var(--accent)}
.title-main .pixel{color:var(--pixel-green)}

.section-title{font-size:76px;font-weight:800;color:#fff;line-height:1.4; text-shadow: 0 4px 20px rgba(0,0,0,0.5);}
.section-title .ac{color:var(--accent)}

.body-big{font-size:48px;color:rgba(255,255,255,0.85);line-height:1.6;font-weight:600; text-shadow: 0 2px 10px rgba(0,0,0,0.5);}
.body-mid{font-size:40px;color:rgba(255,255,255,0.7);line-height:1.6; text-shadow: 0 2px 10px rgba(0,0,0,0.5);}

.divider{width:80px;height:6px;background:linear-gradient(90deg,var(--accent),var(--pixel-green));margin:30px 0 40px; border-radius: 3px;}

.watermark{position:absolute;bottom:50px;right:70px;
           font-size:18px;color:rgba(255,255,255,0.15);letter-spacing:5px;font-weight:bold;}

/* 装饰性元素 */
.pixel-box {
    position: absolute;
    border: 4px solid rgba(255,107,53,0.2);
    width: 200px; height: 200px;
    z-index: 0;
}
.pb-1 { top: 150px; right: 100px; }
.pb-2 { bottom: 250px; left: 80px; width: 120px; height: 120px; border-color: rgba(76,175,80,0.2); }

.content-wrapper { position: relative; z-index: 10; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div class="status-bar"></div>
<div class="bg-grid"></div>
<div class="glow-dot"></div>

<div class="pixel-box pb-1"></div>
<div class="pixel-box pb-2"></div>

<!-- Slide 1 -->
<div class="slide" id="s1">
  <div class="content-wrapper">
    <div class="title-main">当<span class="ac">《迷你地铁》</span><br>遇上复古<span class="pixel">像素</span> RPG世界</div>
    <div class="divider"></div>
  </div>
</div>

<!-- Slide 2 -->
<div class="slide" id="s2">
  <div class="content-wrapper">
    <div class="section-title">这可能是今年<br><span class="ac">最惊艳的创意缝合！</span></div>
  </div>
</div>

<!-- Slide 3 -->
<div class="slide" id="s3">
  <div class="content-wrapper">
    <div class="body-big">当极简的地铁线路图，<br>铺进充满细节的沙盘地图。</div>
  </div>
</div>

<!-- Slide 4 -->
<div class="slide" id="s4">
  <div class="content-wrapper">
    <div class="body-big">不仅要规划<span class="ac">高效路线</span>，<br>还要穿过高山与城堡。</div>
  </div>
</div>

<!-- Slide 5 -->
<div class="slide" id="s5">
  <div class="content-wrapper">
    <div class="body-big">不同颜色的线路交织在翠绿森林上，<br>像是魔法世界里的<span class="ac">动脉</span>。</div>
  </div>
</div>

<!-- Slide 6 -->
<div class="slide" id="s6">
  <div class="content-wrapper">
    <div class="body-big">每一个站点都是一座村落，<br>每一次换乘都是一段<span class="ac">冒险</span>。</div>
  </div>
</div>

<!-- Slide 7 -->
<div class="slide" id="s7">
  <div class="content-wrapper">
    <div class="section-title">你的城市，<br><span class="pixel">准备好通车了吗？</span></div>
    <div class="divider"></div>
  </div>
</div>

<div class="watermark">PIXEL METRO DESIGN</div>

<script>
const tl = gsap.timeline({repeat:-1, paused:false});
// 7 页，每页 3.5 - 4.5s
const durations = [4.5, 3.5, 3.5, 3.5, 4.0, 4.0, 4.5];
for(let i=1; i<=durations.length; i++){
  const prev = i===1 ? durations.length : i-1;
  const stay = durations[i-1];
  
  // 入场特效
  tl.to('#s'+prev, {opacity:0, y:-30, pointerEvents:'none', duration:0.4, ease:'power2.in'}, '+=0')
    .fromTo('#s'+i, {opacity:0, y:40, scale:0.95},
            {opacity:1, y:0, scale:1, pointerEvents:'auto', duration:0.6, ease:'back.out(1.2)'})
    .to({}, {duration: stay - 1.0}); // 停留时间
}

// 背景网格滚动
gsap.to('.bg-grid', {
  backgroundPosition: '60px 60px',
  duration: 4,
  ease: 'none',
  repeat: -1
});
</script>
</body>
</html>
