<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博数字人 · 小贝</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e1b4b; --accent: #a78bfa; --accent-2: #f472b6;
    --text: #e2e8f0; --text-dim: #94a3b8; --card: rgba(30,41,59,.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, var(--bg-2), var(--bg-1));
    color: var(--text); min-height:100vh; overflow:hidden;
  }
  .stage { display:flex; flex-direction:column; height:100vh; max-width:900px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:10px; padding:8px 4px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#34d399; box-shadow:0 0 12px #34d399; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.4 } }
  header h1 { font-size:18px; font-weight:600; letter-spacing:.5px; }
  header .status { font-size:12px; color:var(--text-dim); }
  .avatar-zone { flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; }
  .avatar-wrap { position:relative; width:min(360px, 70vw); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .halo { position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle, rgba(167,139,250,.25), transparent 65%);
    animation: halo-breathe 4s ease-in-out infinite; }
  @keyframes halo-breathe { 50% { transform:scale(1.06); opacity:.8 } }
  svg.avatar { width:100%; height:100%; filter: drop-shadow(0 10px 40px rgba(167,139,250,.35)); }
  .thinking-badge { position:absolute; bottom:2%; left:50%; transform:translateX(-50%);
    background:var(--card); border:1px solid rgba(167,139,250,.3); border-radius:20px;
    padding:6px 16px; font-size:13px; color:var(--text-dim); display:none; backdrop-filter:blur(8px); }
  .chat-zone { height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    padding:12px 16px; background:var(--card); border-radius:16px; border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px); margin-bottom:12px; }
  .chat-zone::-webkit-scrollbar { width:4px } .chat-zone::-webkit-scrollbar-thumb { background:#334155; border-radius:2px }
  .bubble { max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.6; word-break:break-word; animation:pop .25s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(6px) } }
  .bubble.user { align-self:flex-end; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-bottom-right-radius:4px; }
  .bubble.bot { align-self:flex-start; background:#334155; color:var(--text); border-bottom-left-radius:4px; }
  .input-bar { display:flex; gap:10px; align-items:center; }
  .input-bar input { flex:1; background:var(--card); border:1px solid rgba(255,255,255,.12); color:var(--text);
    padding:12px 16px; border-radius:24px; font-size:14px; outline:none; backdrop-filter:blur(8px); }
  .input-bar input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(167,139,250,.15); }
  .btn { border:none; cursor:pointer; border-radius:50%; width:48px; height:48px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; transition:transform .15s; flex-shrink:0; }
  .btn:hover { transform:scale(1.08) } .btn:active { transform:scale(.95) }
  .btn.mic { background:var(--card); border:1px solid rgba(255,255,255,.15); }
  .btn.mic.rec { background:#ef4444; box-shadow:0 0 0 4px rgba(239,68,68,.3); }
  .hint { text-align:center; font-size:11px; color:var(--text-dim); opacity:.6; margin-top:6px; }
  svg { user-select:none }
  .avatar-wrap.speaking { animation: bob .6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(0) } to { transform:translateY(-8px) } }
  .avatar-wrap.speaking .mouth { animation: mouth-talk .35s ease-in-out infinite alternate; }
  @keyframes mouth-talk { from { transform:scaleY(.35) } to { transform:scaleY(1) } }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="dot"></div>
    <h1>赛博数字人 · 小贝</h1>
    <span class="status" id="status">连接中…</span>
  </header>

  <div class="avatar-zone">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="halo"></div>
      <svg class="avatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="78" rx="52" ry="52" fill="#3b2f63"/>
        <path d="M48 78 Q48 30 100 26 Q152 30 152 78 L152 95 Q100 88 48 95 Z" fill="#4c3a80"/>
        <ellipse cx="100" cy="92" rx="44" ry="48" fill="#ffd9c9"/>
        <ellipse cx="72" cy="108" rx="9" ry="5" fill="#ffb3a8" opacity=".6"/>
        <ellipse cx="128" cy="108" rx="9" ry="5" fill="#ffb3a8" opacity=".6"/>
        <g class="eyes">
          <ellipse cx="82" cy="92" rx="7" ry="9" fill="#3b2f63"/>
          <ellipse cx="118" cy="92" rx="7" ry="9" fill="#3b2f63"/>
          <circle cx="84" cy="89" r="2.5" fill="#fff"/>
          <circle cx="120" cy="89" r="2.5" fill="#fff"/>
        </g>
        <ellipse class="mouth" cx="100" cy="118" rx="9" ry="6" fill="#e5607e"/>
        <path d="M56 140 Q56 180 100 180 Q144 180 144 140 Q144 135 138 136 L62 136 Q56 135 56 140 Z" fill="#a78bfa"/>
        <path d="M62 152 L138 152" stroke="#8b6cf0" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="thinking-badge" id="thinking">正在思考…</div>
    </div>
  </div>

  <div class="chat-zone" id="chat"></div>

  <div class="input-bar">
    <input id="input" type="text" placeholder="跟小贝说点什么…（Enter 发送）" autocomplete="off">
    <button class="btn mic" id="micBtn" title="语音输入（需浏览器授权麦克风）">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/>
      </svg>
    </button>
    <button class="btn" id="sendBtn" title="发送">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="hint">免费 LLM（火山方舟 DeepSeek）+ 免费 TTS（微软 Edge 神经语音）· 全本地运行</div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, busy = false, recog = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('status').textContent = '已连接'; };
  ws.onclose = () => { $('status').textContent = '已断开，重连中…'; setTimeout(connect, 2000); };
  ws.onmessage = ev => handleReply(JSON.parse(ev.data));
}
connect();

function addBubble(who, text) {
  const div = document.createElement('div');
  div.className = `bubble ${who}`;
  div.textContent = text;
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function setSpeaking(on) {
  $('avatarWrap').classList.toggle('speaking', on);
}

function playAudio(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'audio/mpeg' });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  setSpeaking(true);
  audio.play().catch(e => console.error('播放失败', e));
  audio.onended = () => { setSpeaking(false); URL.revokeObjectURL(url); };
  return audio;
}

function handleReply(data) {
  busy = false;
  $('thinking').style.display = 'none';
  if (data.type === 'error') { addBubble('bot', '⚠ ' + data.text); return; }
  addBubble('bot', data.text);
  if (data.audio) playAudio(data.audio);
}

async function send(text) {
  if (!text.trim() || busy) return;
  busy = true;
  addBubble('user', text.trim());
  $('input').value = '';
  $('thinking').style.display = 'block';
  ws.send(JSON.stringify({ type: 'chat', text: text.trim() }));
}

$('sendBtn').onclick = () => send($('input').value);
$('input').addEventListener('keydown', e => { if (e.key === 'Enter') send($('input').value); });

const micBtn = $('micBtn');
let recording = false;
micBtn.onclick = () => {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('当前浏览器不支持语音识别，请使用 Chrome/Edge');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!recog) {
    recog = new SR();
    recog.lang = 'zh-CN';
    recog.continuous = false;
    recog.interimResults = false;
    recog.onresult = ev => send(ev.results[0][0].transcript);
    recog.onend = () => { recording = false; micBtn.classList.remove('rec'); };
    recog.onerror = e => { recording = false; micBtn.classList.remove('rec'); };
  }
  if (recording) { recog.stop(); }
  else { recording = true; micBtn.classList.add('rec'); recog.start(); }
};
</script>
</body>
</html>
