<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED-Skills · 技能库</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --text:#1a1d21; --muted:#6b7280;
    --border:#e5e7eb; --accent:#4f46e5; --accent-soft:#eef2ff; --code:#f3f4f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --panel:#171a21; --text:#e6e8eb; --muted:#9aa3af;
      --border:#2a2f3a; --accent:#818cf8; --accent-soft:#1e2230; --code:#1c2028;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{padding:28px 32px 8px}
  header h1{margin:0;font-size:22px;letter-spacing:.3px}
  header p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 32px 40px;align-items:start}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card h3{margin:0 0 6px;font-size:15px;word-break:break-all}
  .card p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-height:420px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .panel-head h2{margin:0;font-size:15px;word-break:break-all}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none}
  .btn:hover{filter:brightness(1.08)}
  .md{padding:20px 26px;font-size:14px}
  .md h1{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
  .md h2{font-size:17px;margin-top:22px}
  .md h3{font-size:15px}
  .md code{background:var(--code);padding:2px 5px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .md pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md table{border-collapse:collapse;width:100%;margin:12px 0}
  .md th,.md td{border:1px solid var(--border);padding:6px 10px;font-size:13px;text-align:left}
  .md th{background:var(--accent-soft)}
  .md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--accent);color:var(--muted)}
  .md ul,.md ol{padding-left:22px}
  .md a{color:var(--accent)}
  .empty{color:var(--muted);padding:40px;text-align:center}
  .loading{color:var(--muted);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>RED-Skills · 技能库</h1>
  <p>点击卡片在线阅读 SKILL.md，或下载 ZIP 到本地使用。</p>
</header>
<div class="layout">
  <div class="cards" id="cards"></div>
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">选择一个技能</h2>
      <a class="btn" id="zipBtn" href="#" download style="display:none">⬇ 下载 ZIP</a>
    </div>
    <div id="md" class="md"><div class="empty">点击左侧卡片查看 SKILL.md 内容</div></div>
  </div>
</div>

<script>
(function(){
  // ---- 内嵌兜底数据（file:// 下 fetch 受限时使用）----
  var FALLBACK = [
    {"id":"daily-loop-planner","title":"daily-loop-planner","desc":"每日计划+复盘循环工具——早晨拆解目标安排时间块，晚间复盘完成度沉淀经验。触发词：每日计划、日计划、时间管理、晚间复盘、每日复盘、执行跟踪。","zip":"RED-Skills/daily-loop-planner.zip","md":"RED-Skills/daily-loop-planner/SKILL.md","tags":["每日计划","复盘","时间管理","执行跟踪"]},
    {"id":"xhs-content-compliance-review","title":"xhs-content-compliance-review","desc":"小红书笔记发布前合规审查——检测敏感词与违规点并给出改写建议。触发词：合规审查、敏感词检测、笔记审核、发布前检查、违禁词。","zip":"RED-Skills/xhs-content-compliance-review.zip","md":"RED-Skills/xhs-content-compliance-review/SKILL.md","tags":["合规审查","敏感词","小红书","笔记审核"]},
    {"id":"xhs-video-workflow","title":"xhs-video-workflow","desc":"从小红书笔记 Markdown 生成带 ChatTTS 配音的竖版 1080×1920 动画视频。触发词：小红书视频、视频流水线、笔记转视频、制作视频、配音视频。","zip":"RED-Skills/xhs-video-workflow.zip","md":"RED-Skills/xhs-video-workflow/SKILL.md","tags":["小红书视频","ChatTTS","视频流水线","配音"]}
  ];

  var cardsEl = document.getElementById('cards');
  var titleEl = document.getElementById('panelTitle');
  var zipBtn = document.getElementById('zipBtn');
  var mdEl = document.getElementById('md');
  var cards = [];

  // ---- 最小 Markdown 渲染（标题/列表/表格/代码块/引用/行内样式）----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function renderMd(src){
    var lines = src.replace(/\r\n/g,'\n').split('\n');
    var html = '', i = 0, inCode = false, inBuf = [], listType = null;
    function closeList(){ if(listType){html += '</'+listType+'>'; listType = null;} }
    while(i < lines.length){
      var line = lines[i];
      if(/^```/.test(line)){
        if(inCode){html += '<pre><code>'+esc(inBuf.join('\n'))+'</code></pre>';inCode=false;inBuf=[];}
        else{closeList();inCode=true;inBuf=[];}
        i++;continue;
      }
      if(inCode){inBuf.push(line);i++;continue;}
      if(/^\s*$/.test(line)){closeList();html += '\n';i++;continue;}
      var h = line.match(/^(#{1,6})\s+(.*)/);
      if(h){closeList();html += '<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';i++;continue;}
      var ul = line.match(/^\s*[-*+]\s+(.*)/);
      var ol = line.match(/^\s*\d+\.\s+(.*)/);
      if(ul || ol){
        var t = ul ? 'ul' : 'ol';
        if(listType !== t){closeList();html += '<'+t+'>';listType=t;}
        html += '<li>'+inline((ul?ul[1]:ol[1]))+'</li>';
        i++;continue;
      }
      closeList();
      if(/^\|/.test(line)){
        var rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){rows.push(lines[i]);i++;}
        if(rows.length >= 2){
          html += '<table>';
          var head = rows[0].split('|').slice(1,-1).map(function(c){return c.trim();});
          html += '<thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
          for(var r=2;r<rows.length;r++){
            var cells = rows[r].split('|').slice(1,-1);
            html += '<tr>'+cells.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';
          }
          html += '</tbody></table>';
        }
        continue;
      }
      var bq = line.match(/^>\s?(.*)/);
      if(bq){html += '<blockquote>'+inline(bq[1])+'</blockquote>';i++;continue;}
      html += '<p>'+inline(line)+'</p>';
      i++;
    }
    closeList();
    if(inCode){html += '<pre>'+esc(inBuf.join('\n'))+'</pre>';}
    return html;
  }

  function renderCards(){
    cardsEl.innerHTML = '';
    cards.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = '<h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p><div class="tags">'+
        (c.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';
      el.addEventListener('click', function(){ select(c, el); });
      cardsEl.appendChild(el);
    });
  }

  function select(c, el){
    document.querySelectorAll('.card').forEach(function(x){x.classList.remove('active');});
    if(el) el.classList.add('active');
    titleEl.textContent = c.title;
    zipBtn.style.display = 'inline-flex';
    zipBtn.href = c.zip;
    zipBtn.setAttribute('download', c.id + '.zip');
    mdEl.innerHTML = '<div class="loading">加载中…</div>';
    fetch(c.md).then(function(r){return r.text();}).then(function(txt){
      mdEl.innerHTML = renderMd(txt);
    }).catch(function(){
      mdEl.innerHTML = '<div class="empty">无法加载 SKILL.md（file:// 下浏览器可能拦截 fetch）。<br>请点击右上角「下载 ZIP」获取完整内容。</div>';
    });
  }

  function load(){
    fetch('data.json').then(function(r){return r.json();}).then(function(d){
      cards = d; renderCards();
    }).catch(function(){
      cards = FALLBACK; renderCards();
    });
  }
  load();
})();
</script>
</body>
</html>
